/* 공용전기 일반용전력 단가 */
const GB={high2:8230,high1:7220,low:6160};
const GR={high2:{s:130,w:130,o:98},high1:{s:130,w:130,o:98},low:{s:163,w:163,o:114}};

function getRate(ym){const s=ym.replace("-","");return RH.find(r=>s>=r.from.replace("-","")&&s<=r.to.replace("-",""))||RH[RH.length-1];}
function getSeason(ym){const m=parseInt(ym.split("-")[1]);return m>=7&&m<=8?"s":m>=12||m<=2?"w":"o";}

/* ① 주택용전력 세대 요금 (저압=종합 / 고압=단일) */
function calcUnit(kwh,rate,hi,sk){
  if(kwh<=0)return{basic:0,energy:0,climate:0,fuel:0,sub:0,vat:0,fund:0,total:0,tier:0,en:[]};
  const bas=hi?rate.bh:rate.bl;
  const en=(hi?rate.eh:rate.el)[sk]||(hi?rate.eh:rate.el).o;
  const t=rate.t;
  let tier=0;for(let i=t.length-1;i>=0;i--){if(kwh>t[i]){tier=i+1;break;}}
  const basic=bas[Math.min(tier,bas.length-1)];
  let energy=0,rem=kwh;
  for(let i=0;i<t.length;i++){const lo=i===0?0:t[i-1],used=Math.min(rem,t[i]-lo);energy+=Math.round(used*en[i]);rem-=used;if(rem<=0)break;}
  if(rem>0)energy+=Math.round(rem*en[en.length-1]);
  const climate=Math.round(kwh*(rate.cl||0)),fuel=Math.round(kwh*(rate.fu||0));
  const sub=basic+energy+climate+fuel,vat=Math.round(sub*0.10),fund=Math.round(sub*0.037);
  return{basic,energy,climate,fuel,sub,vat,fund,total:Math.round((sub+vat+fund)/10)*10,tier,en};
}

/* ② 공용전기 일반용전력 요금 (G-123 핵심!) */
function calcCommon(cKwh,totalKwh,billingKw,gType,sk,rate){
  if(cKwh<=0)return{basic:0,energy:0,climate:0,fuel:0,elecFee:0,vat:0,fund:0,total:0,ratio:0,basicRate:0,ur:0};
  const basicRate=GB[gType]||GB.high2;
  const ur=(GR[gType]||GR.high2)[sk];
  const ratio=totalKwh>0?cKwh/totalKwh:0;
  const basic=Math.round(billingKw*ratio*basicRate);
  const energy=Math.round(cKwh*ur);
  const climate=Math.round(cKwh*(rate.cl||0));
  const fuel=Math.round(cKwh*(rate.fu||0));
  const elecFee=basic+energy+climate+fuel;
  const vat=Math.round(elecFee*0.10),fund=Math.round(elecFee*0.032);
  return{basic,energy,climate,fuel,elecFee,vat,fund,total:Math.round((elecFee+vat+fund)/10)*10,ratio:Math.round(ratio*10000)/100,basicRate,ur};
}

/* UI 공통 */
function Panel({children,style={}}){return <div style={{background:"#0d2137",borderRadius:12,border:"1px solid #2a4a7f",padding:"16px 18px",marginBottom:14,...style}}>{children}</div>;}
function Tag({c,ch}){return <span style={{background:c+"22",border:`1px solid ${c}66`,borderRadius:5,padding:"2px 8px",fontSize:10,color:c,fontWeight:700}}>{ch}</span>;}
function Row({label,value,color="#e8eaf0",bold=false,sub=""}){
  return(

      </span>
      <span style={{fontSize:bold?13:11,fontWeight:bold?800:500,color}}>{value}</span>
    </div>
  );
}

          </div>

                          <Row label="기후환경요금" value={r.climate.toLocaleString()+"원"}/>
                          <Row label="연료비조정액" value={r.fuel.toLocaleString()+"원"}/>

                  <Row label="②기본요금" value={commonC.basic.toLocaleString()+"원"} sub={`${billingKw}×${commonC.ratio.toFixed(2)}%×${commonC.basicRate.toLocaleString()}`}/>
                  <Row label="③사용량요금" value={commonC.energy.toLocaleString()+"원"} sub={`${commonKwh.toLocaleString()}kWh×${commonC.ur}원`}/>

                  <Row label="⑥연료비조정액" value={commonC.fuel.toLocaleString()+"원"}/>

                  <Row label="⑦부가가치세(10%)" value={commonC.vat.toLocaleString()+"원"}/>
                  <Row label="⑧전력산업기반기금(3.2%)" value={commonC.fund.toLocaleString()+"원"}/>

                    <span style={{fontSize:12,fontWeight:700,color:"#3d2a00"}}>⑨ 공용전기 청구요금</span>
                    <span style={{fontSize:22,fontWeight:900,color:"#3d2a00"}}>{commonC.total.toLocaleString()}원</span>

                {/* 최종 비교표 */}
                <Panel style={{border:"2px solid #ffd60044"}}>
                  <div style={{fontSize:13,fontWeight:800,color:"#ffd600",marginBottom:12}}>단지 전체 최종 비교표</div>
                  <table>
                    <thead>
                      <tr style={{background:"#061428"}}>
                        {["구분","종합계약","단일계약","차액"].map(h=>(

                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {[
                        ["세대합계(주택용)",totalUnitCostL,totalUnitCostH,false],
                        [`  세대당(${unitCount}세대)`,unitL.total,unitH.total,false],
                        ["공용(일반용전력)",commonC.total,commonH.total,false],
                        ["단지 전체 합계",totalL,totalH,true],
                        ["세대당 환산",Math.round(totalL/unitCount),Math.round(totalH/unitCount),true],

                            <td style={{padding:"7px 8px",textAlign:"right",color:"#ef9a9a",fontWeight:bold?800:400,fontSize:bold?14:12}}>{b.toLocaleString()}원</td>
                            <td style={{padding:"7px 8px",textAlign:"right",color:d>0?"#ef9a9a":d<0?"#43a047":"#888",fontWeight:bold?800:600,fontSize:bold?13:11}}>

        {/* ══ 요금계산 탭 (단순) ══ */}
        {tab==="basic"&&(
          <BasicCalc rate={rate} sk={sk}/>

        {/* ══ 이력조회 탭 ══ */}
        {tab==="history"&&(

      </div>

      {/* 하단 */}
      <div style={{textAlign:"center",padding:"16px",fontSize:10,color:"rgba(255,255,255,0.25)",borderTop:"1px solid #1e3a5f",marginTop:16}}>
        GBS G-123 | 한전 오류 수정판 | CO2 {CO2}kg/kWh | 2002~2024 | ojs.co.kr

    </div>
  );
}

/* ══ 기본 요금계산 ══ */
function BasicCalc({rate,sk}){
  const[kwh,setKwh]=useState(300);
  const rL=calcUnit(kwh,rate,false,sk),rH=calcUnit(kwh,rate,true,sk);
  const diff=rL.total-rH.total;
  return(
    <div>
      <Panel>
        <div style={{fontSize:14,fontWeight:800,color:"#90caf9",marginBottom:4}}>⚡ 세대 단순 요금 계산</div>
        <div style={{fontSize:10,color:"rgba(255,255,255,0.4)",marginBottom:14}}>세대 단위 주택용전력 저압 vs 고압 (공용전기 미포함 단순비교)</div>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
          <input type="number" value={kwh} min={0} max={2000} onChange={e=>setKwh(Math.max(0,Number(e.target.value)))}
            style={{flex:1,padding:"12px",background:"#0a1e36",border:"2px solid #42a5f5",borderRadius:8,color:"#42a5f5",fontSize:24,fontWeight:900,textAlign:"center"}}/>
          <span style={{color:"rgba(255,255,255,0.4)",fontSize:13}}>kWh</span>
        </div>
        <input type="range" min={0} max={1000} step={10} value={kwh} onChange={e=>setKwh(Number(e.target.value))} style={{marginBottom:14}}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
          {[{l:"종합(저압) 주택용",r:rL,c:"#90caf9"},{l:"단일(고압) 주택용",r:rH,c:"#ef9a9a"}].map(({l,r,c})=>(
            <div key={l} style={{background:"#061428",borderRadius:10,padding:"14px",border:`2px solid ${c}44`,textAlign:"center"}}>
              <div style={{fontSize:10,color:"rgba(255,255,255,0.4)",marginBottom:4}}>{l}</div>
              <div style={{fontSize:26,fontWeight:900,color:c}}>{r.total.toLocaleString()}<span style={{fontSize:12,color:"rgba(255,255,255,0.3)",marginLeft:3}}>원</span></div>
              <div style={{marginTop:6}}><Tag c={TC[r.tier]} ch={`${r.tier+1}단계`}/></div>
              <div style={{fontSize:10,color:"rgba(255,255,255,0.3)",marginTop:4}}>기본 {r.basic.toLocaleString()} + 전력량 {r.energy.toLocaleString()}</div>
            </div>
          ))}
        </div>
        <div style={{background:"linear-gradient(135deg,#0a0e1a,#0d1e3a)",borderRadius:10,border:"2px solid #ffd60044",padding:"14px",textAlign:"center"}}>
          <div style={{fontSize:10,color:"rgba(255,255,255,0.4)",marginBottom:4}}>세대 단위 차액 (공용전기 미포함)</div>
          <div style={{fontSize:36,fontWeight:900,color:diff>0?"#ef9a9a":diff<0?"#43a047":"#fff"}}>{diff>0?"▲":diff<0?"▼":""}{Math.abs(diff).toLocaleString()}원</div>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",marginTop:4}}>※ 정확한 비교는 G-123 분석 탭을 이용하세요</div>
        </div>
      </Panel>
    </div>
  );
}

/* ══ 요금이력 ══ */
function HistoryTab(){
  const[kwh,setKwh]=useState(300);const[type,setType]=useState("low");
  const rows=RH.map(r=>{const sk2=getSeason(r.from+"-01");return{...r,res:calcUnit(kwh,r,type==="high",sk2)};});
  const vals=rows.map(r=>r.res.total);const mn=Math.min(...vals),mx2=Math.max(...vals);
  return(
    <Panel style={{border:"2px solid #ce93d833"}}>
      <div style={{fontSize:14,fontWeight:800,color:"#ce93d8",marginBottom:12}}>📅 2002~2024 요금이력 비교</div>
      <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:12,flexWrap:"wrap"}}>
        <input type="number" value={kwh} min={0} max={2000} onChange={e=>setKwh(Number(e.target.value))}
          style={{width:90,padding:"6px 10px",background:"#0a1e36",border:"2px solid #ce93d8",borderRadius:8,color:"#ce93d8",fontSize:16,fontWeight:800,textAlign:"center"}}/>
        <span style={{fontSize:11,color:"rgba(255,255,255,0.4)"}}>kWh</span>
        {[{k:"low",l:"종합(저압)"},{k:"high",l:"단일(고압)"}].map(x=>(
          <button key={x.k} onClick={()=>setType(x.k)} style={{padding:"5px 12px",borderRadius:7,cursor:"pointer",border:type===x.k?"2px solid #ce93d8":"1px solid #2a4a7f",background:type===x.k?"rgba(206,147,216,0.15)":"#0a1e36",color:type===x.k?"#ce93d8":"#5a7a9a",fontWeight:700,fontSize:11}}>{x.l}</button>
        ))}
        <input type="range" min={0} max={1000} step={10} value={kwh} onChange={e=>setKwh(Number(e.target.value))} style={{flex:1,minWidth:80}}/>
      </div>
      <div style={{maxHeight:420,overflowY:"auto"}}>
        <table>
          <thead style={{position:"sticky",top:0}}>
            <tr style={{background:"#061428"}}>
              {["기간/구간","단계","기본","전력량","최종"].map(h=>(
                <th key={h} style={{padding:"7px 5px",textAlign:h==="기간/구간"?"left":"right",color:"rgba(255,255,255,0.4)",fontSize:10,borderBottom:"1px solid #2a4a7f",whiteSpace:"nowrap"}}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.map((r,i)=>{const cur=r.to==="2099-12",isMin=r.res.total===mn,isMax=r.res.total===mx2;return(
              <tr key={i} style={{background:cur?"rgba(67,160,71,0.08)":i%2?"#0a1628":"#0d1e36",borderLeft:cur?"3px solid #43a047":isMin?"3px solid #43a047":isMax?"3px solid #e53935":"3px solid transparent"}}>
                <td style={{padding:"6px 5px",fontSize:10}}>
                  <div style={{color:cur?"#43a047":"rgba(255,255,255,0.6)",fontWeight:cur?800:400}}>{r.note}</div>
                  <div style={{fontSize:8,color:"rgba(255,255,255,0.25)"}}>{r.from}~{r.to==="2099-12"?"현재":r.to}</div>
                </td>
                <td style={{padding:"6px 5px",textAlign:"right"}}><Tag c={TC[r.res.tier]} ch={String(r.res.tier+1)}/></td>
                <td style={{padding:"6px 5px",textAlign:"right",color:"rgba(255,255,255,0.5)",fontSize:10}}>{r.res.basic.toLocaleString()}</td>
                <td style={{padding:"6px 5px",textAlign:"right",color:"#90caf9",fontSize:10}}>{r.res.energy.toLocaleString()}</td>
                <td style={{padding:"6px 5px",textAlign:"right",color:cur?"#43a047":isMin?"#43a047":isMax?"#ef5350":"#ffd600",fontWeight:cur||isMin||isMax?900:600,fontSize:cur?14:11}}>{r.res.total.toLocaleString()}원{isMin?" 📉":isMax?" 📈":""}</td>
              </tr>
            );})}
          </tbody>
        </table>
      </div>
    </Panel>
  );
}

/* ══ 잠금박스 ══ */
function LockBox({need,feat}){
  const info={2:{name:"특별회원",price:"월 9,900원",color:"#ffd600"},3:{name:"비즈니스회원",price:"월 123,000원",color:"#43a047"}}[need];
  return(
    <div style={{borderRadius:12,border:`2px solid ${info.color}44`,background:"rgba(6,15,30,0.97)",padding:"40px 20px",textAlign:"center"}}>
      <div style={{fontSize:40,marginBottom:12}}>🔒</div>
      <div style={{fontSize:16,fontWeight:800,color:info.color,marginBottom:8}}>{info.name} 전용 기능</div>
      <div style={{fontSize:12,color:"rgba(255,255,255,0.5)",marginBottom:20,lineHeight:1.9}}>{feat}<br/>{info.name}({info.price}) 이상에서 이용 가능</div>
      <a href={WP.upgradeUrl} style={{padding:"12px 28px",borderRadius:10,background:`linear-gradient(135deg,${info.color},${info.color}aa)`,color:"#000",fontWeight:900,fontSize:13,textDecoration:"none",display:"inline-block"}}>{info.name}으로 업그레이드</a>
    </div>
  );
}

/* ══ 등급안내 ══ */
function PlanTab(){

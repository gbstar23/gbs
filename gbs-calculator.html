<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GBS G-123 전기요금 분석기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
  :root{
    --ink:#12233F;
    --ink-soft:#5B6472;
    --paper:#FAF7F1;
    --paper-2:#F1ECE1;
    --panel:#FFFFFF;
    --rule:#D9D2C2;
    --teal:#2F6F6D;
    --teal-soft:#E4EFEE;
    --copper:#B8631F;
    --copper-soft:#F5E9DC;
    --green:#1F7A4C;
    --green-soft:#E4F2E9;
    --red:#B23A3A;
    --red-soft:#F7E7E7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      linear-gradient(var(--rule) 1px, transparent 1px);
    background-size: 100% 40px;
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #root{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}

  .masthead{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom:3px solid var(--ink); padding-bottom:18px; margin-bottom:6px;
  }
  .masthead .eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.12em;
    color:var(--ink-soft); text-transform:uppercase; margin-bottom:6px;
  }
  .masthead h1{
    font-family:'Noto Serif KR', serif; font-weight:700; font-size:30px; margin:0;
    letter-spacing:-.01em;
  }
  .masthead .sub{ font-size:13px; color:var(--ink-soft); margin-top:6px; max-width:520px; line-height:1.55;}
  .masthead .tag{
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink);
    background:var(--paper-2); border:1px solid var(--rule); padding:6px 12px;
    white-space:nowrap;
  }

  .layout{ display:grid; grid-template-columns: 1fr; gap:18px; margin-top:24px;}

  .panel{
    background:var(--panel); border:1px solid var(--rule); position:relative;
  }
  .panel-head{
    display:flex; align-items:center; gap:10px;
    padding:14px 18px; border-bottom:1px solid var(--rule);
    background:var(--paper-2);
  }
  .panel-head .idx{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--paper);
    background:var(--ink); width:22px; height:22px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .panel-head h2{ font-family:'Noto Serif KR',serif; font-size:16px; margin:0; font-weight:600;}
  .panel-head p{ margin:2px 0 0; font-size:12px; color:var(--ink-soft);}
  .panel-body{ padding:18px; }

  .grid{ display:grid; gap:14px; }
  .grid-2{ grid-template-columns:repeat(2,1fr); }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  @media(max-width:760px){ .grid-2,.grid-3,.grid-4{ grid-template-columns:1fr 1fr; } }

  .field label{
    display:block; font-size:12px; color:var(--ink-soft); margin-bottom:6px;
    font-weight:500;
  }
  .field label .unit{ color:#9AA2AC; font-weight:400; }
  .field .input-wrap{ position:relative; }
  .field input{
    width:100%; border:1px solid var(--rule); background:var(--paper);
    padding:10px 12px; font-family:'JetBrains Mono',monospace; font-size:14px;
    color:var(--ink); text-align:right; border-radius:2px;
  }
  .field input:focus{ outline:none; border-color:var(--ink); background:#fff; }
  .field.accent-teal input{ border-color:#BFDAD8; }
  .field.accent-copper input{ border-color:#E3C9AC; }

  .subtotal-line{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-top:14px; padding-top:12px; border-top:1px dashed var(--rule);
    font-family:'JetBrains Mono',monospace;
  }
  .subtotal-line .label{ font-size:12.5px; color:var(--ink-soft); font-family:'Noto Sans KR',sans-serif;}
  .subtotal-line .value{ font-size:18px; font-weight:600; }
  .subtotal-line.teal .value{ color:var(--teal); }
  .subtotal-line.copper .value{ color:var(--copper); }

  .toggle-row{ display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .toggle-row input[type=checkbox]{ width:16px; height:16px; }
  .toggle-row label{ font-size:13px; color:var(--ink); }
  .note{ font-size:11.5px; color:var(--ink-soft); line-height:1.6; margin-top:10px; }

  /* Ledger / receipt comparison */
  .ledger{
    display:grid; grid-template-columns:1fr auto 1fr; gap:0;
    background:var(--panel); border:1px solid var(--ink);
  }
  .ledger-col{ padding:20px; }
  .ledger-col.before{ border-right:none; }
  .ledger-col.after{ }
  .ledger-mid{
    width:1px; background-repeat:repeat-y;
    background-image: linear-gradient(var(--rule) 60%, transparent 0%);
    background-size: 1px 10px;
  }
  .ledger-tag{
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.08em;
    text-transform:uppercase; padding:3px 8px; display:inline-block; margin-bottom:10px;
  }
  .ledger-tag.before{ background:var(--teal-soft); color:var(--teal); }
  .ledger-tag.after{ background:var(--copper-soft); color:var(--copper); }
  .ledger-col h3{ font-family:'Noto Serif KR',serif; font-size:20px; margin:0 0 14px; }
  .ledger-row{
    display:flex; justify-content:space-between; font-size:13px;
    padding:7px 0; border-bottom:1px dotted var(--rule);
  }
  .ledger-row .k{ color:var(--ink-soft); }
  .ledger-row .v{ font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; }
  .ledger-final{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-top:14px; padding-top:12px; border-top:2px solid var(--ink);
  }
  .ledger-final .k{ font-size:13px; font-weight:600; }
  .ledger-final .v{ font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:700; }
  .ledger-col.before .ledger-final .v{ color:var(--teal); }
  .ledger-col.after .ledger-final .v{ color:var(--copper); }

  /* Savings stub */
  .stub{
    margin-top:0; background:var(--ink); color:var(--paper);
    padding:24px 22px; position:relative; overflow:hidden;
  }
  .stub::before{
    content:""; position:absolute; top:0; left:0; right:0; height:6px;
    background: repeating-linear-gradient(90deg, var(--paper) 0 10px, transparent 0 18px);
    opacity:.5;
  }
  .stub-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:6px;}
  @media(max-width:760px){ .stub-grid{ grid-template-columns:1fr; } }
  .stub .eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em;
    text-transform:uppercase; color:#B8C4D6; margin-bottom:4px;
  }
  .stub-item .big{
    font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:700;
    color:#F5E7C8;
  }
  .stub-item .lbl{ font-size:12px; color:#B8C4D6; margin-top:4px; }
  .stub-item.negative .big{ color:#E8A7A7; }

  /* validation banner */
  .validate{
    display:flex; justify-content:space-between; align-items:center; gap:16px;
    padding:16px 18px; border:1px solid var(--rule); background:var(--paper-2);
    flex-wrap:wrap;
  }
  .validate .stat{ font-family:'JetBrains Mono',monospace; font-size:13px; }
  .badge{
    font-family:'JetBrains Mono',monospace; font-size:11px; padding:4px 10px;
    border-radius:20px; font-weight:600;
  }
  .badge.ok{ background:var(--green-soft); color:var(--green); }
  .badge.warn{ background:var(--red-soft); color:var(--red); }

  .table-wrap{ overflow-x:auto; }
  table.mini{ width:100%; border-collapse:collapse; font-size:12.5px; }
  table.mini th, table.mini td{
    padding:8px 10px; text-align:right; border-bottom:1px solid var(--rule);
    font-family:'JetBrains Mono',monospace;
  }
  table.mini th:first-child, table.mini td:first-child{ text-align:left; font-family:'Noto Sans KR',sans-serif; }
  table.mini th{ color:var(--ink-soft); font-weight:500; font-family:'Noto Sans KR',sans-serif; }

  footer{ margin-top:36px; padding-top:16px; border-top:1px solid var(--rule);
    font-size:11.5px; color:var(--ink-soft); line-height:1.7;}

  /* Hero result card - dark theme */
  .hero-result{
    background: radial-gradient(ellipse at top, #241a3f 0%, #140f22 72%);
    border: 2px solid #F2C94C; border-radius: 14px; padding: 30px 26px;
    box-shadow: 0 0 44px rgba(242,201,76,0.14), inset 0 1px 0 rgba(255,255,255,0.05);
    color: #E9E4F5;
  }
  .hero-title{ text-align:center; font-family:'Noto Serif KR',serif; font-weight:700;
    font-size:21px; letter-spacing:.02em; color:#F5E7C8; }
  .hero-sub{ text-align:center; font-size:12px; color:#9C93B8; margin-top:6px;
    margin-bottom:26px; font-family:'JetBrains Mono',monospace; }
  .hero-grid{ display:grid; grid-template-columns:1fr auto 1fr; gap:18px; align-items:stretch; }
  @media(max-width:820px){ .hero-grid{ grid-template-columns:1fr; } }
  .hero-card{ border-radius:10px; padding:22px 20px; }
  .hero-card.teal{ background:rgba(94,234,212,0.06); border:1px solid rgba(94,234,212,0.35); }
  .hero-card.copper{ background:rgba(251,191,119,0.06); border:1px solid rgba(251,191,119,0.35); }
  .hero-card .hc-title{ font-family:'Noto Serif KR',serif; font-weight:700; font-size:17px; text-align:center; }
  .hero-card.teal .hc-title{ color:#5EEAD4; }
  .hero-card.copper .hc-title{ color:#FBBF77; }
  .hero-card .hc-sub{ text-align:center; font-size:11px; color:#9C93B8; margin-top:3px; line-height:1.7; }
  .hero-card .hc-block{ text-align:center; margin-top:18px; }
  .hero-card .hc-label{ font-size:11.5px; color:#9C93B8; margin-bottom:7px; }
  .hero-card .hc-value{ font-family:'JetBrains Mono',monospace; font-size:25px; font-weight:700; }
  .hero-card.teal .hc-value{ color:#8FF5E1; }
  .hero-card.copper .hc-value{ color:#FFD19B; }
  .hero-card .hc-note{ font-size:10.5px; color:#786E99; margin-top:5px; }
  .hero-card .hc-divider{ border-top:1px dashed rgba(255,255,255,0.14); margin:18px 0; }
  .hero-card .hc-final-label{ font-size:11.5px; color:#9C93B8; text-align:center; }
  .hero-card .hc-final-value{ font-family:'JetBrains Mono',monospace; font-size:31px; font-weight:800;
    text-align:center; margin-top:7px; }
  .hero-card.teal .hc-final-value{ color:#B8FFF0; }
  .hero-card.copper .hc-final-value{ color:#FFE1BE; }
  .hero-card .hc-per{ text-align:center; font-size:12px; color:#9C93B8; margin-top:7px;
    font-family:'JetBrains Mono',monospace; }
  .hero-center{ display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:18px 10px; min-width:170px; }
  .hero-center .hc-tri{ font-size:32px; line-height:1; color:#FF6B9D; }
  .hero-center .hc-diff{ font-family:'JetBrains Mono',monospace; font-size:29px; font-weight:800;
    margin-top:4px; color:#FF6B9D; }
  .hero-center .hc-diff-unit{ font-size:11px; color:#9C93B8; margin-top:3px; }
  .hero-center .hc-sep{ width:70%; border-top:1px solid rgba(255,255,255,0.12); margin:16px 0; }
  .hero-center .hc-sub-label{ font-size:11px; color:#9C93B8; }
  .hero-center .hc-sub-value{ font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:700;
    color:#E9E4F5; margin-top:3px; margin-bottom:12px; }
  .hero-banner{ margin-top:24px; border-radius:8px; padding:15px 18px; text-align:center; }
  .hero-banner.warn{ background:rgba(255,107,157,0.1); border:1px solid rgba(255,107,157,0.35); }
  .hero-banner.good{ background:rgba(134,239,172,0.1); border:1px solid rgba(134,239,172,0.35); }
  .hero-banner .hb-title{ font-weight:700; font-size:14.5px; }
  .hero-banner.warn .hb-title{ color:#FF9DBE; }
  .hero-banner.good .hb-title{ color:#86EFAC; }
  .hero-banner .hb-detail{ font-size:12px; color:#B8AED8; margin-top:7px; font-family:'JetBrains Mono',monospace; }
  .hero-empty{ text-align:center; font-size:12px; color:#786E99; margin-top:6px; }

  .live-hint{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--green);
    background:var(--green-soft); display:inline-block; padding:4px 9px; margin-top:8px;
    border-radius:3px;
  }
  .live-tick{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft);
  }
  .live-tick b{ color:var(--ink); }
  @keyframes flashUpdate{ 0%{ background:#FCEFC7; } 100%{ background:transparent; } }
  .flash{ animation: flashUpdate 700ms ease-out; }
</style>
</head>
<body>
<div id="root"></div>

<script data-gbs-app="1">
const { useState, useMemo, useRef, useEffect } = React;
const h = React.createElement;

function toNum(v){
  if (v === "" || v === null || v === undefined) return 0;
  const n = parseFloat(String(v).replace(/,/g,""));
  return isNaN(n) ? 0 : n;
}
function fmt(n){
  const r = Math.round(n);
  return r.toLocaleString('ko-KR');
}
function fmt1(n){
  return (Math.round(n*10)/10).toLocaleString('ko-KR');
}

function Field(props){
  const { label, unit, value, onChange, accent, hint } = props;
  return h('div', {className:"field" + (accent ? " accent-"+accent : "")},
    h('label', null, label, unit ? h('span', {className:"unit"}, " (" + unit + ")") : null),
    h('div', {className:"input-wrap"},
      h('input', {
        inputMode:"decimal",
        value: value,
        onChange: function(e){ onChange(e.target.value); }
      })
    ),
    hint ? h('div', {className:"live-hint"}, hint) : null
  );
}

function FlashValue(props){
  // wraps a value so it visibly flashes whenever it changes, proving live recalculation
  const ref = useRef(null);
  const prev = useRef(props.value);
  useEffect(function(){
    if (prev.current !== props.value && ref.current){
      ref.current.classList.remove('flash');
      // force reflow to restart animation
      void ref.current.offsetWidth;
      ref.current.classList.add('flash');
    }
    prev.current = props.value;
  }, [props.value]);
  return h('span', { ref: ref, className: props.className || "" }, props.children);
}

function DiagnosticPanel(){
  const [count, setCount] = useState(0);
  const [info, setInfo] = useState(null);
  useEffect(function(){
    setInfo({
      reactVersion: React.version || "알 수 없음",
      rootElCount: document.querySelectorAll('#root').length,
      scriptTagCount: document.querySelectorAll('script').length,
      appScriptCount: document.querySelectorAll('script[data-gbs-app]').length
    });
  }, []);
  const dupWarning = info && (info.rootElCount > 1 || info.appScriptCount > 1);
  return h('div', {style:{
    background: dupWarning ? "#F7E7E7" : "#E4F2E9",
    border: "1px solid " + (dupWarning ? "#B23A3A" : "#1F7A4C"),
    padding: "14px 18px", marginBottom: "18px", fontFamily: "'JetBrains Mono',monospace", fontSize: "12px"
  }},
    h('div', {style:{fontWeight:700, marginBottom:"8px"}}, dupWarning ? "⚠ 진단: 중복 삽입 의심" : "✓ 진단: 정상 작동 확인용 패널"),
    info ? h('div', {style:{lineHeight:"1.8"}},
      h('div', null, "React 버전: " + info.reactVersion),
      h('div', null, "페이지 내 #root 요소 개수: " + info.rootElCount + (info.rootElCount > 1 ? "  ← 2개 이상이면 이 HTML이 페이지에 중복 삽입된 것입니다" : "")),
      h('div', null, "페이지 내 전체 <script> 태그 개수: " + info.scriptTagCount)
    ) : h('div', null, "확인 중..."),
    h('div', {style:{marginTop:"10px", display:"flex", alignItems:"center", gap:"10px"}},
      h('button', {
        onClick: function(){ setCount(function(c){ return c + 1; }); },
        style:{padding:"6px 14px", cursor:"pointer", border:"1px solid #12233F", background:"#12233F", color:"#fff", fontFamily:"inherit"}
      }, "여기를 눌러보세요"),
      h('span', null, "클릭 횟수: " + count + (count > 0 ? " ← 이 숫자가 올라가면 반응형 자체는 정상 작동 중입니다" : ""))
    )
  );
}

function App(){
  const [households, setHouseholds] = useState("300");
  const [appliedPower, setAppliedPower] = useState("2393");
  const [houseUsage, setHouseUsage] = useState("523053");
  const [commonUsage, setCommonUsage] = useState("98106");

  const [compBasic, setCompBasic] = useState("7884430");
  const [compEnergy, setCompEnergy] = useState("128128069");
  const [compClimate, setCompClimate] = useState("5590431");
  const [compFuel, setCompFuel] = useState("3105795");

  const [singleBasic, setSingleBasic] = useState("5149730");
  const [singleEnergy, setSingleEnergy] = useState("109211555");
  const [singleClimate, setSingleClimate] = useState("5590431");
  const [singleFuel, setSingleFuel] = useState("3105795");

  const [useSubCustomer, setUseSubCustomer] = useState(true);
  const [subUsage, setSubUsage] = useState("2453");
  const [subBasic, setSubBasic] = useState("30800");
  const [subEnergy, setSubEnergy] = useState("324777");
  const [subClimate, setSubClimate] = useState("22077");
  const [subFuel, setSubFuel] = useState("12265");

  const [vatRate, setVatRate] = useState("10");
  const [fundRate, setFundRate] = useState("3.7");

  const [actualBill, setActualBill] = useState("138212180");

  const calc = useMemo(function(){
    const hh = toNum(households);
    const power = toNum(appliedPower);
    const hUse = toNum(houseUsage);
    const cUse = toNum(commonUsage);
    const totalUsage = hUse + cUse;

    const comp = { basic: toNum(compBasic), energy: toNum(compEnergy), climate: toNum(compClimate), fuel: toNum(compFuel) };
    const compSubtotal = comp.basic + comp.energy + comp.climate + comp.fuel;

    const single = { basic: toNum(singleBasic), energy: toNum(singleEnergy), climate: toNum(singleClimate), fuel: toNum(singleFuel) };
    const singleSubtotal = single.basic + single.energy + single.climate + single.fuel;

    const sub = { usage: toNum(subUsage), basic: toNum(subBasic), energy: toNum(subEnergy), climate: toNum(subClimate), fuel: toNum(subFuel) };
    const subSubtotal = sub.basic + sub.energy + sub.climate + sub.fuel;
    const subApplied = useSubCustomer ? subSubtotal : 0;

    const vr = toNum(vatRate) / 100;
    const fr = toNum(fundRate) / 100;

    const beforePre = compSubtotal + subApplied;
    const beforeVat = Math.round(beforePre * vr);
    const beforeFund = Math.floor((beforePre * fr) / 10) * 10;
    const beforeFinal = beforePre + beforeVat + beforeFund;

    const afterPre = singleSubtotal + subApplied;
    const afterVat = Math.round(afterPre * vr);
    const afterFund = Math.floor((afterPre * fr) / 10) * 10;
    const afterFinal = afterPre + afterVat + afterFund;

    const diff = beforeFinal - afterFinal;
    const diffPct = beforeFinal > 0 ? (diff / beforeFinal) * 100 : 0;
    const perHouseholdMonthly = hh > 0 ? diff / hh : 0;
    const annual = diff * 12;
    const perHouseholdAnnual = hh > 0 ? annual / hh : 0;

    const compUnitEnergy = totalUsage > 0 ? comp.energy / totalUsage : 0;
    const singleUnitEnergy = totalUsage > 0 ? single.energy / totalUsage : 0;
    const compUnitBasic = power > 0 ? comp.basic / power : 0;
    const singleUnitBasic = power > 0 ? single.basic / power : 0;

    const actual = toNum(actualBill);
    const actualDiff = actual - beforeFinal;
    const actualDiffPct = actual > 0 ? (actualDiff / actual) * 100 : 0;

    return {
      hh: hh, power: power, hUse: hUse, cUse: cUse, totalUsage: totalUsage,
      comp: comp, compSubtotal: compSubtotal, single: single, singleSubtotal: singleSubtotal,
      sub: sub, subSubtotal: subSubtotal, subApplied: subApplied,
      beforePre: beforePre, beforeVat: beforeVat, beforeFund: beforeFund, beforeFinal: beforeFinal,
      afterPre: afterPre, afterVat: afterVat, afterFund: afterFund, afterFinal: afterFinal,
      diff: diff, diffPct: diffPct, perHouseholdMonthly: perHouseholdMonthly, annual: annual, perHouseholdAnnual: perHouseholdAnnual,
      compUnitEnergy: compUnitEnergy, singleUnitEnergy: singleUnitEnergy, compUnitBasic: compUnitBasic, singleUnitBasic: singleUnitBasic,
      actual: actual, actualDiff: actualDiff, actualDiffPct: actualDiffPct
    };
  }, [households, appliedPower, houseUsage, commonUsage,
      compBasic, compEnergy, compClimate, compFuel,
      singleBasic, singleEnergy, singleClimate, singleFuel,
      useSubCustomer, subUsage, subBasic, subEnergy, subClimate, subFuel,
      vatRate, fundRate, actualBill]);

  const withinTolerance = Math.abs(calc.actualDiffPct) < 3;

  return h(React.Fragment, null,

    h(DiagnosticPanel, null),

    h('div', {className:"masthead"},
      h('div', null,

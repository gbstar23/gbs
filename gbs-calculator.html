<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GBS G-123 전기요금 분석기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --ink:#12233F;
    --ink-soft:#5B6472;
    --paper:#FAF7F1;
    --paper-2:#F1ECE1;
    --panel:#FFFFFF;
    --rule:#D9D2C2;
    --teal:#2F6F6D;
    --teal-soft:#E4EFEE;
    --copper:#B8631F;
    --copper-soft:#F5E9DC;
    --green:#1F7A4C;
    --green-soft:#E4F2E9;
    --red:#B23A3A;
    --red-soft:#F7E7E7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      linear-gradient(var(--rule) 1px, transparent 1px);
    background-size: 100% 40px;
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #root{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}

  .masthead{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom:3px solid var(--ink); padding-bottom:18px; margin-bottom:6px;
  }
  .masthead .eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.12em;
    color:var(--ink-soft); text-transform:uppercase; margin-bottom:6px;
  }
  .masthead h1{
    font-family:'Noto Serif KR', serif; font-weight:700; font-size:30px; margin:0;
    letter-spacing:-.01em;
  }
  .masthead .sub{ font-size:13px; color:var(--ink-soft); margin-top:6px; max-width:520px; line-height:1.55;}
  .masthead .tag{
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink);
    background:var(--paper-2); border:1px solid var(--rule); padding:6px 12px;
    white-space:nowrap;
  }

  .layout{ display:grid; grid-template-columns: 1fr; gap:18px; margin-top:24px;}

  .panel{
    background:var(--panel); border:1px solid var(--rule); position:relative;
  }
  .panel-head{
    display:flex; align-items:center; gap:10px;
    padding:14px 18px; border-bottom:1px solid var(--rule);
    background:var(--paper-2);
  }
  .panel-head .idx{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--paper);
    background:var(--ink); width:22px; height:22px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .panel-head h2{ font-family:'Noto Serif KR',serif; font-size:16px; margin:0; font-weight:600;}
  .panel-head p{ margin:2px 0 0; font-size:12px; color:var(--ink-soft);}
  .panel-body{ padding:18px; }

  .grid{ display:grid; gap:14px; }
  .grid-2{ grid-template-columns:repeat(2,1fr); }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  @media(max-width:760px){ .grid-2,.grid-3,.grid-4{ grid-template-columns:1fr 1fr; } }

  .field label{
    display:block; font-size:12px; color:var(--ink-soft); margin-bottom:6px;
    font-weight:500;
  }
  .field label .unit{ color:#9AA2AC; font-weight:400; }
  .field .input-wrap{ position:relative; }
  .field input{
    width:100%; border:1px solid var(--rule); background:var(--paper);
    padding:10px 12px; font-family:'JetBrains Mono',monospace; font-size:14px;
    color:var(--ink); text-align:right; border-radius:2px;
  }
  .field input:focus{ outline:none; border-color:var(--ink); background:#fff; }
  .field.accent-teal input{ border-color:#BFDAD8; }
  .field.accent-copper input{ border-color:#E3C9AC; }

  .subtotal-line{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-top:14px; padding-top:12px; border-top:1px dashed var(--rule);
    font-family:'JetBrains Mono',monospace;
  }
  .subtotal-line .label{ font-size:12.5px; color:var(--ink-soft); font-family:'Noto Sans KR',sans-serif;}
  .subtotal-line .value{ font-size:18px; font-weight:600; }
  .subtotal-line.teal .value{ color:var(--teal); }
  .subtotal-line.copper .value{ color:var(--copper); }

  .toggle-row{ display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .toggle-row input[type=checkbox]{ width:16px; height:16px; }
  .toggle-row label{ font-size:13px; color:var(--ink); }
  .note{ font-size:11.5px; color:var(--ink-soft); line-height:1.6; margin-top:10px; }

  /* Ledger / receipt comparison */
  .ledger{
    display:grid; grid-template-columns:1fr auto 1fr; gap:0;
    background:var(--panel); border:1px solid var(--ink);
  }
  .ledger-col{ padding:20px; }
  .ledger-col.before{ border-right:none; }
  .ledger-col.after{ }
  .ledger-mid{
    width:1px; background-repeat:repeat-y;
    background-image: linear-gradient(var(--rule) 60%, transparent 0%);
    background-size: 1px 10px;
  }
  .ledger-tag{
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.08em;
    text-transform:uppercase; padding:3px 8px; display:inline-block; margin-bottom:10px;
  }
  .ledger-tag.before{ background:var(--teal-soft); color:var(--teal); }
  .ledger-tag.after{ background:var(--copper-soft); color:var(--copper); }
  .ledger-col h3{ font-family:'Noto Serif KR',serif; font-size:20px; margin:0 0 14px; }
  .ledger-row{
    display:flex; justify-content:space-between; font-size:13px;
    padding:7px 0; border-bottom:1px dotted var(--rule);
  }
  .ledger-row .k{ color:var(--ink-soft); }
  .ledger-row .v{ font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; }
  .ledger-final{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-top:14px; padding-top:12px; border-top:2px solid var(--ink);
  }
  .ledger-final .k{ font-size:13px; font-weight:600; }
  .ledger-final .v{ font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:700; }
  .ledger-col.before .ledger-final .v{ color:var(--teal); }
  .ledger-col.after .ledger-final .v{ color:var(--copper); }

  /* Savings stub */
  .stub{
    margin-top:0; background:var(--ink); color:var(--paper);
    padding:24px 22px; position:relative; overflow:hidden;
  }
  .stub::before{
    content:""; position:absolute; top:0; left:0; right:0; height:6px;
    background: repeating-linear-gradient(90deg, var(--paper) 0 10px, transparent 0 18px);
    opacity:.5;
  }
  .stub-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:6px;}
  @media(max-width:760px){ .stub-grid{ grid-template-columns:1fr; } }
  .stub .eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em;
    text-transform:uppercase; color:#B8C4D6; margin-bottom:4px;
  }
  .stub-item .big{
    font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:700;
    color:#F5E7C8;
  }
  .stub-item .lbl{ font-size:12px; color:#B8C4D6; margin-top:4px; }
  .stub-item.negative .big{ color:#E8A7A7; }

  /* validation banner */
  .validate{
    display:flex; justify-content:space-between; align-items:center; gap:16px;
    padding:16px 18px; border:1px solid var(--rule); background:var(--paper-2);
    flex-wrap:wrap;
  }
  .validate .stat{ font-family:'JetBrains Mono',monospace; font-size:13px; }
  .badge{
    font-family:'JetBrains Mono',monospace; font-size:11px; padding:4px 10px;
    border-radius:20px; font-weight:600;
  }
  .badge.ok{ background:var(--green-soft); color:var(--green); }
  .badge.warn{ background:var(--red-soft); color:var(--red); }

  .table-wrap{ overflow-x:auto; }
  table.mini{ width:100%; border-collapse:collapse; font-size:12.5px; }
  table.mini th, table.mini td{
    padding:8px 10px; text-align:right; border-bottom:1px solid var(--rule);
    font-family:'JetBrains Mono',monospace;
  }
  table.mini th:first-child, table.mini td:first-child{ text-align:left; font-family:'Noto Sans KR',sans-serif; }
  table.mini th{ color:var(--ink-soft); font-weight:500; font-family:'Noto Sans KR',sans-serif; }

  footer{ margin-top:36px; padding-top:16px; border-top:1px solid var(--rule);
    font-size:11.5px; color:var(--ink-soft); line-height:1.7;}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo } = React;

function toNum(v){
  if (v === "" || v === null || v === undefined) return 0;
  const n = parseFloat(String(v).replace(/,/g,""));
  return isNaN(n) ? 0 : n;
}
function fmt(n){
  const r = Math.round(n);
  return r.toLocaleString('ko-KR');
}
function fmt1(n){
  return (Math.round(n*10)/10).toLocaleString('ko-KR');
}

function Field({label, unit, value, onChange, accent}){
  return (
    <div className={"field" + (accent ? " accent-"+accent : "")}>
      <label>{label} {unit && <span className="unit">({unit})</span>}</label>
      <div className="input-wrap">
        <input
          inputMode="decimal"
          value={value}
          onChange={e=>onChange(e.target.value)}
          onBlur={e=>onChange(String(toNum(e.target.value)))}
        />
      </div>
    </div>
  );
}

function App(){
  // 1) 기본 계약 정보
  const [households, setHouseholds] = useState("300");
  const [appliedPower, setAppliedPower] = useState("2393");
  const [houseUsage, setHouseUsage] = useState("523053");
  const [commonUsage, setCommonUsage] = useState("98106");

  // 2) 종합계약(개선전) - 세대+공용
  const [compBasic, setCompBasic] = useState("7884430");
  const [compEnergy, setCompEnergy] = useState("128128069");
  const [compClimate, setCompClimate] = useState("5590431");
  const [compFuel, setCompFuel] = useState("3105795");

  // 3) 단일계약(개선후) - 세대+공용 통합
  const [singleBasic, setSingleBasic] = useState("5149730");
  const [singleEnergy, setSingleEnergy] = useState("109211555");
  const [singleClimate, setSingleClimate] = useState("5590431");
  const [singleFuel, setSingleFuel] = useState("3105795");

  // 4) 자고객(일반용전력, 별도계약 - 개선 전/후 동일 적용)
  const [useSubCustomer, setUseSubCustomer] = useState(true);
  const [subUsage, setSubUsage] = useState("2453");
  const [subBasic, setSubBasic] = useState("30800");
  const [subEnergy, setSubEnergy] = useState("324777");
  const [subClimate, setSubClimate] = useState("22077");
  const [subFuel, setSubFuel] = useState("12265");

  // 5) 세율
  const [vatRate, setVatRate] = useState("10");
  const [fundRate, setFundRate] = useState("3.7");

  // 6) 검증용 실제 청구금액(선택)
  const [actualBill, setActualBill] = useState("138212180");

  const calc = useMemo(()=>{
    const hh = toNum(households);
    const power = toNum(appliedPower);
    const hUse = toNum(houseUsage);
    const cUse = toNum(commonUsage);
    const totalUsage = hUse + cUse;

    const comp = { basic: toNum(compBasic), energy: toNum(compEnergy), climate: toNum(compClimate), fuel: toNum(compFuel) };
    const compSubtotal = comp.basic + comp.energy + comp.climate + comp.fuel;

    const single = { basic: toNum(singleBasic), energy: toNum(singleEnergy), climate: toNum(singleClimate), fuel: toNum(singleFuel) };
    const singleSubtotal = single.basic + single.energy + single.climate + single.fuel;

    const sub = { usage: toNum(subUsage), basic: toNum(subBasic), energy: toNum(subEnergy), climate: toNum(subClimate), fuel: toNum(subFuel) };
    const subSubtotal = sub.basic + sub.energy + sub.climate + sub.fuel;
    const subApplied = useSubCustomer ? subSubtotal : 0;

    const vr = toNum(vatRate)/100;
    const fr = toNum(fundRate)/100;

    const beforePre = compSubtotal + subApplied;
    const beforeVat = Math.round(beforePre * vr);
    const beforeFund = Math.floor((beforePre * fr) / 10) * 10;
    const beforeFinal = beforePre + beforeVat + beforeFund;

    const afterPre = singleSubtotal + subApplied;
    const afterVat = Math.round(afterPre * vr);
    const afterFund = Math.floor((afterPre * fr) / 10) * 10;
    const afterFinal = afterPre + afterVat + afterFund;

    const diff = beforeFinal - afterFinal;
    const diffPct = beforePre > 0 ? (diff/beforeFinal)*100 : 0;
    const perHouseholdMonthly = hh > 0 ? diff/hh : 0;
    const annual = diff*12;
    const perHouseholdAnnual = hh > 0 ? annual/hh : 0;

    const compUnitEnergy = totalUsage>0 ? comp.energy/totalUsage : 0;
    const singleUnitEnergy = totalUsage>0 ? single.energy/totalUsage : 0;
    const compUnitBasic = power>0 ? comp.basic/power : 0;
    const singleUnitBasic = power>0 ? single.basic/power : 0;

    const actual = toNum(actualBill);
    const actualDiff = actual - beforeFinal;
    const actualDiffPct = actual>0 ? (actualDiff/actual)*100 : 0;

    return {
      hh, power, hUse, cUse, totalUsage,
      comp, compSubtotal, single, singleSubtotal, sub, subSubtotal, subApplied,
      beforePre, beforeVat, beforeFund, beforeFinal,
      afterPre, afterVat, afterFund, afterFinal,
      diff, diffPct, perHouseholdMonthly, annual, perHouseholdAnnual,
      compUnitEnergy, singleUnitEnergy, compUnitBasic, singleUnitBasic,
      actual, actualDiff, actualDiffPct
    };
  }, [households, appliedPower, houseUsage, commonUsage,
      compBasic, compEnergy, compClimate, compFuel,
      singleBasic, singleEnergy, singleClimate, singleFuel,
      useSubCustomer, subUsage, subBasic, subEnergy, subClimate, subFuel,
      vatRate, fundRate, actualBill]);

  const withinTolerance = Math.abs(calc.actualDiffPct) < 3;

  return (
    <React.Fragment>
      <div className="masthead">
        <div>
          <div className="eyebrow">GBS · G-123 Electricity Tariff Model</div>
          <h1>전기요금 분석기</h1>
          <div className="sub">종합계약(세대별 개별계산) vs 단일계약(주택용고압 통합계산) — 자고객(일반용전력) 별도 반영, 부가세·기금 포함 최종 청구요금 비교 도구</div>
        </div>
        <div className="tag">고객번호 05 3066 1603 · 주택용고압</div>
      </div>

      <div className="layout">

        {/* 1. 기본 계약정보 */}
        <div className="panel">
          <div className="panel-head">
            <div className="idx">1</div>
            <div>
              <h2>기본 계약정보</h2>
              <p>한전 사이버지점 청구서 기준 세대수 · 요금적용전력 · 사용량 입력</p>
            </div>
          </div>
          <div className="panel-body">
            <div className="grid grid-4">
              <Field label="세대수" unit="세대" value={households} onChange={setHouseholds} />
              <Field label="요금적용전력" unit="kW" value={appliedPower} onChange={setAppliedPower} />
              <Field label="세대사용량" unit="kWh" value={houseUsage} onChange={setHouseUsage} />
              <Field label="공용사용량" unit="kWh" value={commonUsage} onChange={setCommonUsage} />
            </div>
            <div className="subtotal-line">
              <span className="label">세대+공용 총사용량</span>
              <span className="value">{fmt(calc.totalUsage)} kWh</span>
            </div>
          </div>
        </div>

        {/* 2 & 3 side by side */}
        <div className="grid grid-2">
          <div className="panel">
            <div className="panel-head">
              <div className="idx" style={{background:"var(--teal)"}}>2</div>
              <div>
                <h2>종합계약 (개선전)</h2>
                <p>세대별 개별계산 합산 · 세대+공용</p>
              </div>
            </div>
            <div className="panel-body">
              <div className="grid grid-2">
                <Field accent="teal" label="기본요금" unit="원" value={compBasic} onChange={setCompBasic} />
                <Field accent="teal" label="전력량요금" unit="원" value={compEnergy} onChange={setCompEnergy} />
                <Field accent="teal" label="기후환경요금" unit="원" value={compClimate} onChange={setCompClimate} />
                <Field accent="teal" label="연료비조정액" unit="원" value={compFuel} onChange={setCompFuel} />
              </div>
              <div className="subtotal-line teal">
                <span className="label">종합계약 소계 (세전)</span>
                <span className="value">{fmt(calc.compSubtotal)} 원</span>
              </div>
              <div className="note">kWh당 전력량단가 ≈ {fmt1(calc.compUnitEnergy)}원 · kW당 기본단가 ≈ {fmt1(calc.compUnitBasic)}원</div>
            </div>
          </div>

          <div className="panel">
            <div className="panel-head">
              <div className="idx" style={{background:"var(--copper)"}}>3</div>
              <div>
                <h2>단일계약 (개선후)</h2>
                <p>공용전기 별도 없이 세대+공용 하나로 통합계산</p>
              </div>
            </div>
            <div className="panel-body">
              <div className="grid grid-2">
                <Field accent="copper" label="기본요금" unit="원" value={singleBasic} onChange={setSingleBasic} />
                <Field accent="copper" label="전력량요금" unit="원" value={singleEnergy} onChange={setSingleEnergy} />
                <Field accent="copper" label="기후환경요금" unit="원" value={singleClimate} onChange={setSingleClimate} />
                <Field accent="copper" label="연료비조정액" unit="원" value={singleFuel} onChange={setSingleFuel} />
              </div>
              <div className="subtotal-line copper">
                <span className="label">단일계약 소계 (세전)</span>
                <span className="value">{fmt(calc.singleSubtotal)} 원</span>
              </div>
              <div className="note">kWh당 전력량단가 ≈ {fmt1(calc.singleUnitEnergy)}원 · kW당 기본단가 ≈ {fmt1(calc.singleUnitBasic)}원</div>
            </div>
          </div>
        </div>

        {/* 4. 자고객 */}
        <div className="panel">
          <div className="panel-head">
            <div className="idx">4</div>
            <div>
              <h2>자고객 (일반용전력, 별도계약)</h2>
              <p>상가 등 자체고객 사용분 — 계약방식과 무관하게 개선전·개선후 동일하게 가산</p>
            </div>
          </div>
          <div className="panel-body">
            <div className="toggle-row">
              <input type="checkbox" id="subToggle" checked={useSubCustomer} onChange={e=>setUseSubCustomer(e.target.checked)} />
              <label htmlFor="subToggle">자고객 요금을 개선전·개선후 청구액에 별도 가산합니다</label>
            </div>
            <div className="grid grid-4">
              <Field label="자고객 사용량" unit="kWh" value={subUsage} onChange={setSubUsage} />
              <Field label="기본요금" unit="원" value={subBasic} onChange={setSubBasic} />
              <Field label="사용량요금" unit="원" value={subEnergy} onChange={setSubEnergy} />
              <Field label="기후환경요금" unit="원" value={subClimate} onChange={setSubClimate} />
            </div>
            <div className="grid grid-4" style={{marginTop:"14px"}}>
              <Field label="연료비조정액" unit="원" value={subFuel} onChange={setSubFuel} />
            </div>
            <div className="subtotal-line">
              <span className="label">자고객 소계 (세전)</span>
              <span className="value">{fmt(calc.subSubtotal)} 원</span>
            </div>
            <div className="note">개선전 = 종합계약 소계 + 자고객 소계 &nbsp;|&nbsp; 개선후 = 단일계약 소계 + 자고객 소계 (자고객분은 두 시나리오 모두 동일 금액 적용)</div>
          </div>
        </div>

        {/* 5. 세율 */}
        <div className="panel">
          <div className="panel-head">
            <div className="idx">5</div>
            <div>
              <h2>부가세 · 기금 적용률</h2>
              <p>부가가치세는 원단위 반올림, 전력산업기반기금은 10원미만 절사</p>
            </div>
          </div>
          <div className="panel-body">
            <div className="grid grid-2">
              <Field label="부가가치세율" unit="%" value={vatRate} onChange={setVatRate} />
              <Field label="전력산업기반기금율" unit="%" value={fundRate} onChange={setFundRate} />
            </div>
          </div>
        </div>

        {/* 6. 결과 - 대조 명세서 */}
        <div className="panel" style={{border:"1px solid var(--ink)"}}>
          <div className="panel-head" style={{background:"var(--ink)"}}>
            <div className="idx" style={{background:"var(--paper)", color:"var(--ink)"}}>6</div>
            <div>
              <h2 style={{color:"var(--paper)"}}>청구요금 대조 명세서</h2>
              <p style={{color:"#B8C4D6"}}>부가세 · 기금 포함 최종 청구요금 비교</p>
            </div>
          </div>
          <div className="panel-body" style={{padding:0}}>
            <div className="ledger">
              <div className="ledger-col before">
                <span className="ledger-tag before">개선전 · 종합계약</span>
                <h3>Before</h3>
                <div className="ledger-row"><span className="k">종합계약 소계</span><span className="v">{fmt(calc.compSubtotal)}</span></div>
                <div className="ledger-row"><span className="k">자고객 소계</span><span className="v">{fmt(calc.subApplied)}</span></div>
                <div className="ledger-row"><span className="k">전기요금계 (세전)</span><span className="v">{fmt(calc.beforePre)}</span></div>
                <div className="ledger-row"><span className="k">부가가치세</span><span className="v">{fmt(calc.beforeVat)}</span></div>
                <div className="ledger-row"><span className="k">전력산업기반기금</span><span className="v">{fmt(calc.beforeFund)}</span></div>
                <div className="ledger-final"><span className="k">최종 청구금액</span><span className="v">{fmt(calc.beforeFinal)}원</span></div>
              </div>
              <div className="ledger-mid"></div>
              <div className="ledger-col after">
                <span className="ledger-tag after">개선후 · 단일계약</span>
                <h3>After</h3>
                <div className="ledger-row"><span className="k">단일계약 소계</span><span className="v">{fmt(calc.singleSubtotal)}</span></div>
                <div className="ledger-row"><span className="k">자고객 소계</span><span className="v">{fmt(calc.subApplied)}</span></div>
                <div className="ledger-row"><span className="k">전기요금계 (세전)</span><span className="v">{fmt(calc.afterPre)}</span></div>
                <div className="ledger-row"><span className="k">부가가치세</span><span className="v">{fmt(calc.afterVat)}</span></div>
                <div className="ledger-row"><span className="k">전력산업기반기금</span><span className="v">{fmt(calc.afterFund)}</span></div>
                <div className="ledger-final"><span className="k">최종 청구금액</span><span className="v">{fmt(calc.afterFinal)}원</span></div>
              </div>
            </div>

            <div className="stub">
              <div className="eyebrow">절감 효과 요약</div>
              <div className="stub-grid">
                <div className={"stub-item" + (calc.diff<0 ? " negative":"")}>
                  <div className="big">{fmt(calc.diff)}원</div>
                  <div className="lbl">월 절감액 (개선전 − 개선후) · {fmt1(calc.diffPct)}%</div>
                </div>
                <div className={"stub-item" + (calc.perHouseholdMonthly<0 ? " negative":"")}>
                  <div className="big">{fmt(calc.perHouseholdMonthly)}원</div>
                  <div className="lbl">세대당 월 절감액 ({fmt(calc.hh)}세대 기준)</div>
                </div>
                <div className={"stub-item" + (calc.annual<0 ? " negative":"")}>
                  <div className="big">{fmt(calc.annual)}원</div>
                  <div className="lbl">연간 절감액 (세대당 연 {fmt(calc.perHouseholdAnnual)}원)</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        {/* 7. 상세 비교표 */}
        <div className="panel">
          <div className="panel-head">
            <div className="idx">7</div>
            <div>
              <h2>항목별 상세 비교표</h2>
              <p>기본요금 · 전력량요금 · 기후환경요금 · 연료비조정액 세부 대조</p>
            </div>
          </div>
          <div className="panel-body">
            <div className="table-wrap">
              <table className="mini">
                <thead>
                  <tr>
                    <th>구분</th>
                    <th>종합계약(개선전)</th>
                    <th>단일계약(개선후)</th>
                    <th>차액</th>
                  </tr>
                </thead>
                <tbody>
                  <tr><td>기본요금</td><td>{fmt(calc.comp.basic)}</td><td>{fmt(calc.single.basic)}</td><td>{fmt(calc.comp.basic-calc.single.basic)}</td></tr>
                  <tr><td>전력량요금</td><td>{fmt(calc.comp.energy)}</td><td>{fmt(calc.single.energy)}</td><td>{fmt(calc.comp.energy-calc.single.energy)}</td></tr>
                  <tr><td>기후환경요금</td><td>{fmt(calc.comp.climate)}</td><td>{fmt(calc.single.climate)}</td><td>{fmt(calc.comp.climate-calc.single.climate)}</td></tr>
                  <tr><td>연료비조정액</td><td>{fmt(calc.comp.fuel)}</td><td>{fmt(calc.single.fuel)}</td><td>{fmt(calc.comp.fuel-calc.single.fuel)}</td></tr>
                  <tr><td>자고객 (동일가산)</td><td>{fmt(calc.subApplied)}</td><td>{fmt(calc.subApplied)}</td><td>0</td></tr>
                  <tr style={{fontWeight:600}}><td>전기요금계 (세전)</td><td>{fmt(calc.beforePre)}</td><td>{fmt(calc.afterPre)}</td><td>{fmt(calc.beforePre-calc.afterPre)}</td></tr>
                  <tr><td>부가가치세</td><td>{fmt(calc.beforeVat)}</td><td>{fmt(calc.afterVat)}</td><td>{fmt(calc.beforeVat-calc.afterVat)}</td></tr>
                  <tr><td>전력산업기반기금</td><td>{fmt(calc.beforeFund)}</td><td>{fmt(calc.afterFund)}</td><td>{fmt(calc.beforeFund-calc.afterFund)}</td></tr>
                  <tr style={{fontWeight:700}}><td>최종 청구금액</td><td>{fmt(calc.beforeFinal)}</td><td>{fmt(calc.afterFinal)}</td><td>{fmt(calc.diff)}</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        {/* 8. 검증 */}
        <div className="panel">
          <div className="panel-head">
            <div className="idx">8</div>
            <div>
              <h2>실제 고지서 검증</h2>
              <p>한전 실제 청구서의 청구금액과 개선전(종합계약) 계산값을 대조합니다</p>
            </div>
          </div>
          <div className="panel-body">
            <div className="grid grid-2" style={{marginBottom:"14px"}}>
              <Field label="실제 고지서 청구금액" unit="원" value={actualBill} onChange={setActualBill} />
            </div>
            <div className="validate">
              <div className="stat">실제 청구금액 <b>{fmt(calc.actual)}원</b> vs 계산값(개선전) <b>{fmt(calc.beforeFinal)}원</b></div>
              <div className="stat">차이 {fmt(calc.actualDiff)}원 ({fmt1(calc.actualDiffPct)}%)</div>
              <span className={"badge " + (withinTolerance ? "ok" : "warn")}>
                {withinTolerance ? "허용범위 이내 (±3%)" : "차이 큼 — 할인항목 확인 필요"}
              </span>
            </div>
            <div className="note">
              실제 고지서에는 다자녀할인·대가족요금·의료기기·에너지캐시백 등 개별 할인 항목이 추가로 반영되어 본 모델의 세전 계산값과 차이가 발생할 수 있습니다. 절감효과 비교(종합 vs 단일)는 두 시나리오에 동일한 세율·조건을 적용하므로 할인 항목과 무관하게 유효합니다.
            </div>
          </div>
        </div>

      </div>

      <footer>
        GBS G-123 전기요금 분석기 · 모든 입력값은 브라우저 내에서만 계산되며 저장되지 않습니다. 세대수·요금적용전력·사용량·요금 4항목·자고객 항목을 한전 사이버지점 자료에 맞게 수정하여 사용하세요.
      </footer>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

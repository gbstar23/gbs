<style>
  :root{
    --ink:#12233F; --ink-soft:#5B6472; --paper:#FAF7F1; --paper-2:#F1ECE1;
    --panel:#FFFFFF; --rule:#D9D2C2; --teal:#2F6F6D; --teal-soft:#E4EFEE;
    --copper:#B8631F; --copper-soft:#F5E9DC; --green:#1F7A4C; --green-soft:#E4F2E9;
    --red:#B23A3A; --red-soft:#F7E7E7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:linear-gradient(var(--rule) 1px, transparent 1px);
    background-size:100% 40px;
    color:var(--ink); font-family:'Noto Sans KR',sans-serif; -webkit-font-smoothing:antialiased;
  }
  #root{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}
  .masthead{display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom:3px solid var(--ink); padding-bottom:18px; margin-bottom:6px;}
  .masthead .eyebrow{font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.12em;
    color:var(--ink-soft); text-transform:uppercase; margin-bottom:6px;}
  .masthead h1{font-family:'Noto Serif KR',serif; font-weight:700; font-size:28px; margin:0; letter-spacing:-.01em;}
  .masthead .sub{font-size:13px; color:var(--ink-soft); margin-top:6px; max-width:560px; line-height:1.55;}
  .masthead .tag{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink);
    background:var(--paper-2); border:1px solid var(--rule); padding:6px 12px; white-space:nowrap;}
  .layout{display:grid; grid-template-columns:1fr; gap:18px; margin-top:24px;}
  .panel{background:var(--panel); border:1px solid var(--rule); position:relative;}
  .panel-head{display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--rule); background:var(--paper-2);}
  .panel-head .idx{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--paper);
    background:var(--ink); width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .panel-head h2{font-family:'Noto Serif KR',serif; font-size:16px; margin:0; font-weight:600;}
  .panel-head p{margin:2px 0 0; font-size:12px; color:var(--ink-soft);}
  .panel-body{padding:18px;}
  .grid{display:grid; gap:14px;}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  @media(max-width:760px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr;}}
  .field label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:6px; font-weight:500;}
  .field label .unit{color:#9AA2AC; font-weight:400;}
  .field input, .field select{width:100%; border:1px solid var(--rule); background:var(--paper);
    padding:10px 12px; font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--ink); border-radius:2px;}
  .field input{text-align:right;}
  .field input:focus, .field select:focus{outline:none; border-color:var(--ink); background:#fff;}
  .note{font-size:11.5px; color:var(--ink-soft); line-height:1.6; margin-top:10px;}
  .warn-box{background:var(--red-soft); border:1px solid #E8B4B4; color:#8A2C2C; font-size:12px;
    padding:10px 14px; margin-top:14px; border-radius:2px; line-height:1.6;}
  .ok-box{background:var(--green-soft); border:1px solid #A9D9BC; color:#1F5C3C; font-size:12px;
    padding:10px 14px; margin-top:14px; border-radius:2px; line-height:1.6;}
  table.mini{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.mini th, table.mini td{padding:8px 10px; text-align:right; border-bottom:1px solid var(--rule); font-family:'JetBrains Mono',monospace;}
  table.mini th:first-child, table.mini td:first-child{text-align:left; font-family:'Noto Sans KR',sans-serif;}
  table.mini th{color:var(--ink-soft); font-weight:500; font-family:'Noto Sans KR',sans-serif;}
  .subtotal-line{display:flex; justify-content:space-between; align-items:baseline; margin-top:14px;
    padding-top:12px; border-top:1px dashed var(--rule); font-family:'JetBrains Mono',monospace;}
  .subtotal-line .label{font-size:12.5px; color:var(--ink-soft); font-family:'Noto Sans KR',sans-serif;}
  .subtotal-line .value{font-size:18px; font-weight:600;}
  .final-box{background:var(--ink); color:var(--paper); padding:22px; text-align:center; margin-top:4px;}
  .final-box .lbl{font-size:12px; color:#B8C4D6; font-family:'JetBrains Mono',monospace; letter-spacing:.08em; text-transform:uppercase;}
  .final-box .val{font-family:'JetBrains Mono',monospace; font-size:34px; font-weight:800; color:#F5E7C8; margin-top:8px;}
  footer{margin-top:36px; padding-top:16px; border-top:1px solid var(--rule); font-size:11.5px; color:var(--ink-soft); line-height:1.7;}
</style>
</head>

<script>
const { useState, useMemo } = React;
const h = React.createElement;

const RATE_DB = JSON.parse(document.getElementById('rate-db-data').textContent);

function toNum(v){
  if (v === "" || v === null || v === undefined) return 0;
  const n = parseFloat(String(v).replace(/,/g,""));
  return isNaN(n) ? 0 : n;
}
function fmt(n){ return Math.round(n).toLocaleString('ko-KR'); }

function seasonForMonth(month, availSeasons){
  if (availSeasons.size === 1 && availSeasons.has('기타')) return '기타';
  if (month === 7 || month === 8) return availSeasons.has('하계') ? '하계' : '기타';
  if (month === 12 || month === 1 || month === 2) return availSeasons.has('동계') ? '동계' : '기타';
  return '기타';
}

// find the point-in-time applicable rate rows for a given type/voltage/option/date
function findRateRows(type, voltage, option, dateStr){
  const target = new Date(dateStr + 'T00:00:00');
  const month = target.getMonth() + 1;
  const pool = RATE_DB.filter(r => r.t === type && r.v === voltage && (option === '' || r.o === option));
  const valid = pool.filter(r => new Date(r.st + 'T00:00:00') <= target);
  if (valid.length === 0) return { applied: null, season: null, rows: [] };
  const latestStart = valid.reduce((m, r) => r.st > m ? r.st : m, valid[0].st);
  const latest = valid.filter(r => r.st === latestStart);
  const availSeasons = new Set(latest.map(r => r.s));
  const season = seasonForMonth(month, availSeasons);
  const rows = latest.filter(r => r.s === season).sort((a,b) => a.f - b.f);
  return { applied: latestStart, season, rows };
}

function Field(props){
  const { label, unit, value, onChange, type, options } = props;
  if (type === 'select') {
    return h('div', {className:"field"},
      h('label', null, label, unit ? h('span',{className:"unit"}, " ("+unit+")") : null),
      h('select', { value, onChange: e => onChange(e.target.value) },
        options.map(o => h('option', {key:o, value:o}, o))
      )
    );
  }
  return h('div', {className:"field"},
    h('label', null, label, unit ? h('span',{className:"unit"}, " ("+unit+")") : null),
    h('input', {
      type: type || 'text',
      value,
      onChange: e => onChange(e.target.value)
    })
  );
}

function App(){
  const [ctype, setCtype] = useState('주택용전력');
  const [voltage, setVoltage] = useState('고압');
  const [option, setOption] = useState('선택Ⅰ');
  const [billMonth, setBillMonth] = useState('2026-07');
  const [households, setHouseholds] = useState('930');
  const [contractPower, setContractPower] = useState('500');
  const [usage, setUsage] = useState('350000');
  const [vatRate, setVatRate] = useState('10');
  const [fundRateDefault, setFundRateDefault] = useState('2.7');
  const [climateDefault, setClimateDefault] = useState('9');
  const [fuelDefault, setFuelDefault] = useState('5');

  const voltageOptions = ctype === '주택용전력' ? ['저압','고압'] : ['저압전력','고압A','고압B'];

  const calc = useMemo(() => {
    const dateStr = billMonth + '-15'; // mid-month anchor for point-in-time lookup
    const opt = ctype === '일반용전력(갑)Ⅰ' ? option : '';
    const { applied, season, rows } = findRateRows(ctype, voltage, opt, dateStr);

    if (!rows.length) {
      return { error: '해당 조건에 맞는 요금 이력이 DB에 없습니다.' };
    }

    const hh = toNum(households);
    const power = toNum(contractPower);
    const u = toNum(usage);
    const vr = toNum(vatRate) / 100;

    let basic = 0, energy = 0, climateRate = null, fuelRate = null, fundRate = null;
    const tierBreakdown = [];

    if (ctype === '주택용전력') {
      const avg = hh > 0 ? u / hh : 0;
      const basicRow = rows.find(r => avg >= r.f && avg <= r.to) || rows[rows.length - 1];
      basic = (basicRow.b || 0) * hh;
      // tier boundaries in the DB are PER-HOUSEHOLD kWh; scale by household count
      // to get the absolute (whole-complex) tier boundaries before clamping total usage.
      for (const r of rows) {
        const tierFrom = r.f * hh;
        const tierTo = r.to * hh;
        const portion = Math.max(0, Math.min(u, tierTo) - tierFrom + hh);
        if (portion > 0) {
          const charge = Math.floor(portion * r.e);
          energy += charge;
          tierBreakdown.push({ from: tierFrom, to: tierTo, usage: portion, rate: r.e, charge });
        }
        if (r.cl != null) climateRate = r.cl;
        if (r.fu != null) fuelRate = r.fu;
        if (r.fd != null) fundRate = r.fd;
      }
    } else {
      const r = rows[0];
      basic = Math.round((r.b || 0) * power);
      energy = Math.floor(u * (r.e || 0));
      tierBreakdown.push({ from: 0, to: '∞', usage: u, rate: r.e, charge: energy });
      if (r.cl != null) climateRate = r.cl;
      if (r.fu != null) fuelRate = r.fu;
      if (r.fd != null) fundRate = r.fd;
    }

    const usedDefaultClimate = climateRate == null;
    const usedDefaultFuel = fuelRate == null;
    const usedDefaultFund = fundRate == null;
    if (climateRate == null) climateRate = toNum(climateDefault);
    if (fuelRate == null) fuelRate = toNum(fuelDefault);
    if (fundRate == null) fundRate = toNum(fundRateDefault);

    const climateFee = Math.floor(u * climateRate);
    const fuelFee = Math.floor(u * fuelRate);
    const subtotal = basic + energy + climateFee + fuelFee;
    const vat = Math.round(subtotal * vr);
    const fund = Math.floor(subtotal * (fundRate/100) / 10) * 10;
    const final = subtotal + vat + fund;

    return {
      applied, season, tierBreakdown, basic, energy, climateFee, fuelFee, climateRate, fuelRate, fundRate,
      usedDefaultClimate, usedDefaultFuel, usedDefaultFund,
      subtotal, vat, fund, final, avg: hh>0? u/hh : 0
    };
  }, [ctype, voltage, option, billMonth, households, contractPower, usage, vatRate, fundRateDefault, climateDefault, fuelDefault]);

  return h(React.Fragment, null,
    h('div', {className:"masthead"},
      h('div', null,
        h('div', {className:"eyebrow"}, "G-123 · Rate DB Engine"),
        h('h1', null, "요금DB 계산기 (2000~2026)"),
        h('div', {className:"sub"}, "01_요금DB의 주택용·일반용 요금이력 669건을 그대로 내장하여, 임의의 청구년월과 사용량을 넣으면 해당 시점에 실제 적용되던 요금표를 자동으로 찾아 계산합니다.")
      ),
      h('div', {className:"tag"}, "DB " + RATE_DB.length + "건 내장")
    ),

    h('div', {className:"layout"},

      h('div', {className:"panel"},
        h('div', {className:"panel-head"},
          h('div', {className:"idx"}, "1"),
          h('div', null, h('h2', null, "계약 조건 입력"), h('p', null, "계약종별·전압구분·청구년월을 먼저 정합니다"))
        ),
        h('div', {className:"panel-body"},
          h('div', {className:"grid grid-4"},
            h(Field, { label:"계약종별", type:"select", value:ctype,
              onChange: v => { setCtype(v); setVoltage(v==='주택용전력' ? '고압' : '저압전력'); },
              options: ['주택용전력','일반용전력(갑)Ⅰ'] }),
            h(Field, { label:"전압구분", type:"select", value:voltage, onChange:setVoltage, options: voltageOptions }),
            ctype === '일반용전력(갑)Ⅰ' ? h(Field, { label:"선택요금", type:"select", value:option, onChange:setOption, options:['선택Ⅰ','선택Ⅱ'] }) : h('div'),
            h(Field, { label:"청구년월", type:"month", value:billMonth, onChange:setBillMonth })
          ),
          h('div', {className:"grid grid-3", style:{marginTop:"14px"}},
            ctype === '주택용전력'
              ? h(Field, { label:"세대수", unit:"호", value:households, onChange:setHouseholds })
              : h(Field, { label:"계약전력", unit:"kW", value:contractPower, onChange:setContractPower }),
            h(Field, { label:"사용량", unit:"kWh", value:usage, onChange:setUsage })
          ),
          calc.error
            ? h('div', {className:"warn-box"}, calc.error)
            : h('div', {className:"note"},
                "적용 요금표 시행일: " + (calc.applied || '-') + " · 판정 계절: " + (calc.season || '-') +
                (ctype === '주택용전력' ? (" · 세대평균 " + calc.avg.toFixed(2) + "kWh") : "")
              )
        )
      ),

      !calc.error && h('div', {className:"panel"},
        h('div', {className:"panel-head"},
          h('div', {className:"idx", style:{background:"var(--teal)"}}, "2"),
          h('div', null, h('h2', null, "전력량요금 단계별 내역"), h('p', null, "DB에서 조회된 구간별 단가 적용"))
        ),
        h('div', {className:"panel-body"},
          h('div', {className:"table-wrap"},
            h('table', {className:"mini"},
              h('thead', null, h('tr', null,
                h('th', null, "구간"), h('th', null, "적용 사용량(kWh)"), h('th', null, "단가(원/kWh)"), h('th', null, "금액(원)")
              )),
              h('tbody', null,
                calc.tierBreakdown.map((t, i) => h('tr', {key:i},
                  h('td', null, fmt(t.from) + " ~ " + (t.to === '∞' ? '∞' : fmt(t.to))),
                  h('td', null, fmt(t.usage)),
                  h('td', null, t.rate),
                  h('td', null, fmt(t.charge))
                ))
              )
            )
          ),
          h('div', {className:"subtotal-line"},
            h('span', {className:"label"}, "전력량요금 합계"),
            h('span', {className:"value"}, fmt(calc.energy) + " 원")
          )
        )
      ),

      !calc.error && h('div', {className:"panel"},
        h('div', {className:"panel-head"},
          h('div', {className:"idx", style:{background:"var(--copper)"}}, "3"),
          h('div', null, h('h2', null, "기후환경·연료비·기금 적용률"), h('p', null, "DB에 이력이 없는 시기는 정책 기본값으로 대체합니다 (아래에서 조정 가능)"))
        ),
        h('div', {className:"panel-body"},
          h('div', {className:"grid grid-4"},
            h(Field, { label:"기후환경단가(기본값)", unit:"원/kWh", value:climateDefault, onChange:setClimateDefault }),
            h(Field, { label:"연료비단가(기본값)", unit:"원/kWh", value:fuelDefault, onChange:setFuelDefault }),
            h(Field, { label:"기금율(기본값)", unit:"%", value:fundRateDefault, onChange:setFundRateDefault }),
            h(Field, { label:"부가가치세율", unit:"%", value:vatRate, onChange:setVatRate })
          ),
          (calc.usedDefaultClimate || calc.usedDefaultFuel || calc.usedDefaultFund)
            ? h('div', {className:"warn-box"},
                "⚠ 이 시점은 DB에 " +
                [calc.usedDefaultClimate && "기후환경단가", calc.usedDefaultFuel && "연료비단가", calc.usedDefaultFund && "기금율"].filter(Boolean).join('·') +
                " 이력이 없어 위 기본값으로 계산했습니다. 실제 청구서와 대조가 필요한 달이면 01_요금DB에 해당 항목을 보강해주세요.")
            : h('div', {className:"ok-box"}, "✓ 이 시점의 기후환경·연료비·기금율은 DB 이력값을 그대로 사용했습니다.")
        )
      ),

      !calc.error && h('div', {className:"panel", style:{border:"1px solid var(--ink)"}},
        h('div', {className:"panel-head", style:{background:"var(--ink)"}},
          h('div', {className:"idx", style:{background:"var(--paper)", color:"var(--ink)"}}, "4"),
          h('div', null, h('h2', {style:{color:"var(--paper)"}}, "최종 청구금액"), h('p', {style:{color:"#B8C4D6"}}, "부가세·기금 포함"))
        ),
        h('div', {className:"panel-body"},
          h('table', {className:"mini"},
            h('tbody', null,
              h('tr', null, h('td', null, "기본요금"), h('td', null, fmt(calc.basic))),
              h('tr', null, h('td', null, "전력량요금"), h('td', null, fmt(calc.energy))),
              h('tr', null, h('td', null, "기후환경요금 (" + calc.climateRate + "원/kWh)"), h('td', null, fmt(calc.climateFee))),
              h('tr', null, h('td', null, "연료비조정액 (" + calc.fuelRate + "원/kWh)"), h('td', null, fmt(calc.fuelFee))),
              h('tr', {style:{fontWeight:600}}, h('td', null, "전기요금계"), h('td', null, fmt(calc.subtotal))),
              h('tr', null, h('td', null, "부가가치세"), h('td', null, fmt(calc.vat))),
              h('tr', null, h('td', null, "전력산업기반기금 (" + calc.fundRate + "%)"), h('td', null, fmt(calc.fund)))
            )
          ),
          h('div', {className:"final-box"},
            h('div', {className:"lbl"}, "최종 청구금액"),
            h('div', {className:"val"}, fmt(calc.final) + "원")
          )
        )
      )
    ),

    h('footer', null,
      "G-123 요금DB 계산기 · 01_요금DB 시트의 669개 요금이력(2000.11~2024.01 시행)을 그대로 내장했습니다. 2024년 이후 시점은 2024-01-01 시행 요금이 계속 적용되는 것으로 계산합니다(별도 개정이 없다는 가정). ",
      "계절 판정: 하계=7·8월, 동계=12·1·2월, 나머지=기타 (해당 시기 DB에 그 계절 구분이 없으면 자동으로 '기타' 기준을 사용). 모든 계산은 브라우저 내에서만 이뤄지며 저장되지 않습니다."
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>

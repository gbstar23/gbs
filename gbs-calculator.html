<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GBS G-123 전기요금 분석기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --ink:#132039;
    --ink-2:#28395c;
    --paper:#F4F1E8;
    --card:#FFFFFF;
    --line:#DAD5C4;
    --muted:#6B6656;
    --gold:#B8860B;
    --gold-bright:#D8A31C;
    --good:#2F6E4F;
    --good-bg:#E7F1EA;
    --bad:#A32F26;
    --bad-bg:#F6E7E4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, rgba(184,134,11,0.06), transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
  .serif{ font-family:'Noto Serif KR', serif; }

  #root{ max-width:1180px; margin:0 auto; padding:36px 20px 80px; }

  /* ---------- Header ---------- */
  .masthead{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom:3px double var(--ink);
    padding-bottom:16px; margin-bottom:6px;
  }
  .masthead .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px; letter-spacing:0.18em; color:var(--gold);
    text-transform:uppercase; margin-bottom:6px; font-weight:700;
  }
  .masthead h1{
    font-family:'Noto Serif KR', serif;
    font-weight:900; font-size:32px; margin:0; color:var(--ink);
    letter-spacing:-0.01em;
  }
  .masthead .sub{ text-align:right; font-size:13px; color:var(--muted); line-height:1.6; }
  .formula-strip{
    margin:18px 0 30px; padding:14px 18px;
    background:var(--ink); color:#f2ede1;
    border-radius:4px;
    font-family:'JetBrains Mono', monospace; font-size:13px;
    display:flex; gap:28px; flex-wrap:wrap; align-items:center;
  }
  .formula-strip .tag{
    font-weight:700; color:var(--gold-bright); margin-right:8px;
  }

  /* ---------- Section labels ---------- */
  .section-label{
    display:flex; align-items:center; gap:10px;
    margin:36px 0 14px;
  }
  .section-label .num{
    font-family:'Noto Serif KR', serif; font-weight:900; font-size:14px;
    color:var(--paper); background:var(--ink);
    width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .section-label h2{
    font-family:'Noto Serif KR', serif; font-size:19px; margin:0; font-weight:700;
  }
  .section-label .line{ flex:1; height:1px; background:var(--line); }

  /* ---------- Cards / grid ---------- */
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .grid-4{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  @media(max-width:760px){ .grid-2{grid-template-columns:1fr;} .grid-4{grid-template-columns:1fr 1fr;} }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:6px;
    padding:20px 22px;
  }
  .card.gong{ border-top:4px solid var(--ink-2); }
  .card.dan{ border-top:4px solid var(--gold); }
  .card-title{
    font-weight:700; font-size:15px; margin:0 0 4px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .card-title .badge{
    font-family:'JetBrains Mono',monospace; font-size:11px; padding:2px 8px;
    border-radius:20px; font-weight:700;
  }
  .card.gong .badge{ background:#e7ecf5; color:var(--ink-2); }
  .card.dan .badge{ background:#f6ecd6; color:var(--gold); }
  .card-desc{ font-size:12px; color:var(--muted); margin-bottom:16px; line-height:1.5; }

  label{
    display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:500;
  }
  .field{ margin-bottom:14px; }
  .field:last-child{ margin-bottom:0; }
  .input-wrap{ position:relative; }
  .input-wrap input{
    width:100%; padding:9px 44px 9px 12px;
    border:1px solid var(--line); border-radius:4px;
    font-family:'JetBrains Mono',monospace; font-size:14px;
    background:#fdfcf9; color:var(--ink);
    transition:border-color .15s, background .15s;
  }
  .input-wrap input:focus{
    outline:none; border-color:var(--ink-2); background:#fff;
  }
  .input-wrap .unit{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    font-size:11px; color:var(--muted); font-weight:600;
  }

  /* ---------- Result ledger ---------- */
  .ledger{
    background:var(--card); border:1px solid var(--line); border-radius:6px;
    overflow:hidden;
  }
  .ledger table{ width:100%; border-collapse:collapse; }
  .ledger th, .ledger td{
    padding:12px 16px; text-align:right; font-size:13.5px;
    border-bottom:1px solid var(--line);
  }
  .ledger th:first-child, .ledger td:first-child{ text-align:left; }
  .ledger thead th{
    background:var(--ink); color:var(--paper);
    font-weight:700; font-size:12.5px; letter-spacing:0.02em;
  }
  .ledger tbody tr:last-child td{ border-bottom:none; }
  .ledger td.num, .ledger th.num{ font-family:'JetBrains Mono',monospace; }
  .ledger tr.subtotal td{ font-weight:700; background:#faf8f2; border-top:1px dashed var(--line); }
  .ledger tr.final td{
    font-weight:900; font-size:16px; background:#fbf6e8;
    border-top:2px solid var(--gold); color:var(--ink);
  }
  .row-label small{ display:block; color:var(--muted); font-weight:400; font-size:11px; margin-top:1px; }

  /* ---------- Stamp / verdict ---------- */
  .verdict{
    margin-top:26px; display:grid; grid-template-columns:1.3fr 1fr; gap:20px; align-items:stretch;
  }
  @media(max-width:760px){ .verdict{ grid-template-columns:1fr; } }
  .verdict-card{
    background:var(--ink); color:var(--paper);
    border-radius:8px; padding:28px 30px; position:relative; overflow:hidden;
  }
  .verdict-card::before{
    content:""; position:absolute; inset:0;
    background:radial-gradient(circle at 90% 10%, rgba(216,163,28,0.18), transparent 55%);
  }
  .verdict-eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.18em;
    color:var(--gold-bright); text-transform:uppercase; margin-bottom:10px; position:relative;
  }
  .verdict-headline{
    font-family:'Noto Serif KR',serif; font-size:24px; font-weight:900; line-height:1.4; position:relative;
    margin:0 0 18px;
  }
  .verdict-headline .amt{ color:var(--gold-bright); }
  .verdict-stats{ display:flex; gap:32px; position:relative; flex-wrap:wrap; }
  .verdict-stats .stat .k{ font-size:11px; color:#b9c0d1; margin-bottom:4px; }
  .verdict-stats .stat .v{
    font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; color:#fff;
  }

  .stamp-wrap{
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); border-radius:8px; background:var(--card);
  }
  .stamp{
    width:172px; height:172px; border-radius:50%;
    border:3px solid currentColor;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transform:rotate(-9deg);
    font-family:'Noto Serif KR',serif;
    position:relative;
  }
  .stamp::after{
    content:""; position:absolute; inset:8px; border:1px solid currentColor; border-radius:50%;
    opacity:0.5;
  }
  .stamp .big{ font-size:26px; font-weight:900; letter-spacing:0.05em; }
  .stamp .small{ font-size:12px; margin-top:6px; font-weight:700; letter-spacing:0.08em; }
  .stamp.good{ color:var(--good); }
  .stamp.bad{ color:var(--bad); }

  footer.note{
    margin-top:40px; padding-top:16px; border-top:1px solid var(--line);
    font-size:11.5px; color:var(--muted); line-height:1.7;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;

/* ---------- helpers ---------- */
const toNum = (v) => {
  if (v === "" || v === null || v === undefined) return 0;
  const n = Number(String(v).replace(/,/g, ""));
  return isNaN(n) ? 0 : n;
};
const fmt = (n) => Math.round(n).toLocaleString("ko-KR");
const round10Down = (n) => Math.floor(n / 10) * 10;

function NumberField({ label, sub, value, onChange, unit }) {
  return (
    <div className="field">
      <label>{label}{sub ? <small style={{display:"block",fontWeight:400,marginTop:2}}>{sub}</small> : null}</label>
      <div className="input-wrap">
        <input
          inputMode="numeric"
          value={value}
          onChange={(e) => onChange(e.target.value.replace(/[^0-9]/g, ""))}
          onBlur={(e) => onChange(String(toNum(e.target.value)))}
        />
        {unit ? <span className="unit">{unit}</span> : null}
      </div>
    </div>
  );
}

function computeCharge({ basic, energy, climate, fuel }) {
  const subtotal = basic + energy + climate + fuel;
  const vat = round10Down(subtotal * 0.1);
  const fund = round10Down(subtotal * 0.037);
  const final = subtotal + vat + fund;
  return { basic, energy, climate, fuel, subtotal, vat, fund, final };
}

function App() {
  // 기본 정보
  const [households, setHouseholds] = useState("300");      // 세대수
  const [appliedPower, setAppliedPower] = useState("2393");  // 요금적용전력
  const [houseUsage, setHouseUsage] = useState("523053");    // 세대사용량
  const [commonUsage, setCommonUsage] = useState("98106");   // 공용사용량

  // 종합요금 (주택용저압 세대합 + 일반용전력 공용)
  const [gBasic, setGBasic] = useState("7884430");
  const [gEnergy, setGEnergy] = useState("128128069");
  const [gClimate, setGClimate] = useState("5590431");
  const [gFuel, setGFuel] = useState("3105795");

  // 단일요금 (주택용고압 전체)
  const [dBasic, setDBasic] = useState("5149730");
  const [dEnergy, setDEnergy] = useState("109211555");
  const [dClimate, setDClimate] = useState("5590431");
  const [dFuel, setDFuel] = useState("3105795");

  const gonghap = useMemo(() => computeCharge({
    basic: toNum(gBasic), energy: toNum(gEnergy), climate: toNum(gClimate), fuel: toNum(gFuel)
  }), [gBasic, gEnergy, gClimate, gFuel]);

  const dan_il = useMemo(() => computeCharge({
    basic: toNum(dBasic), energy: toNum(dEnergy), climate: toNum(dClimate), fuel: toNum(dFuel)
  }), [dBasic, dEnergy, dClimate, dFuel]);

  const hh = Math.max(toNum(households), 1);
  const diff = gonghap.final - dan_il.final;          // 종합 - 단일 (양수면 단일이 유리)
  const cheaper = diff > 0 ? "단일" : diff < 0 ? "종합" : "동일";
  const savingMonthly = Math.abs(diff);
  const savingAnnual = savingMonthly * 12;
  const savingPerHH = savingMonthly / hh;
  const savingPerHHAnnual = savingAnnual / hh;

  const totalUsage = toNum(houseUsage) + toNum(commonUsage);

  const rows = [
    { key: "basic", label: "기본요금" },
    { key: "energy", label: "전력량요금" },
    { key: "climate", label: "기후환경요금" },
    { key: "fuel", label: "연료비조정액" },
  ];

  return (
    <div>
      <div className="masthead">
        <div>
          <div className="eyebrow">KEPCO 사이버지점 자료 기반 · 공동주택 전기요금 진단</div>
          <h1>GBS G-123 전기요금 분석기</h1>
        </div>
        <div className="sub">
          종합계약 vs 단일계약 비교<br/>
          기준월 청구자료 입력 → 부가세·기금 포함 최종 비교
        </div>
      </div>

      <div className="formula-strip">
        <div><span className="tag">종합</span>세대합(주택용저압) + 공용(일반용전력)</div>
        <div style={{opacity:0.5}}>vs</div>
        <div><span className="tag">단일</span>세대+공용 전체를 주택용고압 하나로 통합 산정</div>
      </div>

      {/* ---------- 기본 정보 ---------- */}
      <div className="section-label">
        <div className="num">1</div>
        <h2>기본 정보</h2>
        <div className="line"></div>
      </div>
      <div className="card">
        <div className="grid-4">
          <NumberField label="세대수" unit="세대" value={households} onChange={setHouseholds} />
          <NumberField label="요금적용전력" unit="kW" value={appliedPower} onChange={setAppliedPower} />
          <NumberField label="세대사용량" unit="kWh" value={houseUsage} onChange={setHouseUsage} />
          <NumberField label="공용사용량" unit="kWh" value={commonUsage} onChange={setCommonUsage} />
        </div>
        <div style={{marginTop:14, fontSize:12, color:"var(--muted)"}}>
          총 사용량 <span className="mono" style={{color:"var(--ink)", fontWeight:700}}>{fmt(totalUsage)} kWh</span>
          {"  ·  "}세대당 평균 사용량{" "}
          <span className="mono" style={{color:"var(--ink)", fontWeight:700}}>{fmt(toNum(houseUsage)/hh)} kWh</span>
        </div>
      </div>

      {/* ---------- 요금 입력 ---------- */}
      <div className="section-label">
        <div className="num">2</div>
        <h2>한전 사이버지점 청구 내역 입력</h2>
        <div className="line"></div>
      </div>
      <div className="grid-2">
        <div className="card gong">
          <div className="card-title">종합계약 <span className="badge">주택저압+일반전력</span></div>
          <div className="card-desc">세대분(주택용저압 합산분) + 공용분(일반용전력)의 청구 항목을 입력하세요.</div>
          <NumberField label="기본요금" unit="원" value={gBasic} onChange={setGBasic} />
          <NumberField label="전력량요금" unit="원" value={gEnergy} onChange={setGEnergy} />
          <NumberField label="기후환경요금" unit="원" value={gClimate} onChange={setGClimate} />
          <NumberField label="연료비조정액" unit="원" value={gFuel} onChange={setGFuel} />
        </div>
        <div className="card dan">
          <div className="card-title">단일계약 <span className="badge">주택고압 통합</span></div>
          <div className="card-desc">세대+공용 전체 사용량을 주택용고압 단일 요율로 산정한 청구 항목을 입력하세요.</div>
          <NumberField label="기본요금" unit="원" value={dBasic} onChange={setDBasic} />
          <NumberField label="전력량요금" unit="원" value={dEnergy} onChange={setDEnergy} />
          <NumberField label="기후환경요금" unit="원" value={dClimate} onChange={setDClimate} />
          <NumberField label="연료비조정액" unit="원" value={dFuel} onChange={setDFuel} />
        </div>
      </div>

      {/* ---------- 결과 ---------- */}
      <div className="section-label">
        <div className="num">3</div>
        <h2>최종 비교 (부가세 · 전력산업기반기금 포함)</h2>
        <div className="line"></div>
      </div>

      <div className="ledger">
        <table>
          <thead>
            <tr>
              <th>항목</th>
              <th className="num">종합계약</th>
              <th className="num">단일계약</th>
              <th className="num">차액 (종합&minus;단일)</th>
            </tr>
          </thead>
          <tbody>
            {rows.map(r => (
              <tr key={r.key}>
                <td className="row-label">{r.label}</td>
                <td className="num">{fmt(gonghap[r.key])}</td>
                <td className="num">{fmt(dan_il[r.key])}</td>
                <td className="num">{fmt(gonghap[r.key] - dan_il[r.key])}</td>
              </tr>
            ))}
            <tr className="subtotal">
              <td className="row-label">소계</td>
              <td className="num">{fmt(gonghap.subtotal)}</td>
              <td className="num">{fmt(dan_il.subtotal)}</td>
              <td className="num">{fmt(gonghap.subtotal - dan_il.subtotal)}</td>
            </tr>
            <tr>
              <td className="row-label">부가가치세 (10%)</td>
              <td className="num">{fmt(gonghap.vat)}</td>
              <td className="num">{fmt(dan_il.vat)}</td>
              <td className="num">{fmt(gonghap.vat - dan_il.vat)}</td>
            </tr>
            <tr>
              <td className="row-label">전력산업기반기금 (3.7%)</td>
              <td className="num">{fmt(gonghap.fund)}</td>
              <td className="num">{fmt(dan_il.fund)}</td>
              <td className="num">{fmt(gonghap.fund - dan_il.fund)}</td>
            </tr>
            <tr className="final">
              <td className="row-label">최종 청구금액</td>
              <td className="num">{fmt(gonghap.final)}</td>
              <td className="num">{fmt(dan_il.final)}</td>
              <td className="num">{fmt(diff)}</td>
            </tr>
          </tbody>
        </table>
      </div>

      {/* ---------- 판정 ---------- */}
      <div className="verdict">
        <div className="verdict-card">
          <div className="verdict-eyebrow">진단 결과</div>
          <h3 className="verdict-headline">
            {cheaper === "동일"
              ? "두 계약방식의 청구금액이 동일합니다."
              : <>이 단지는 <span className="amt">{cheaper}계약</span>이 월 <span className="amt">{fmt(savingMonthly)}원</span> 더 유리합니다.</>}
          </h3>
          <div className="verdict-stats">
            <div className="stat">
              <div className="k">월간 차액</div>
              <div className="v mono">{fmt(savingMonthly)} 원</div>
            </div>
            <div className="stat">
              <div className="k">연간 차액</div>
              <div className="v mono">{fmt(savingAnnual)} 원</div>
            </div>
            <div className="stat">
              <div className="k">세대당 월 차액</div>
              <div className="v mono">{fmt(savingPerHH)} 원</div>
            </div>
            <div className="stat">
              <div className="k">세대당 연간 차액</div>
              <div className="v mono">{fmt(savingPerHHAnnual)} 원</div>
            </div>
          </div>
        </div>
        <div className="stamp-wrap">
          <div className={"stamp " + (cheaper === "단일" ? "good" : cheaper === "종합" ? "bad" : "")}>
            <div className="big">{cheaper === "동일" ? "동일" : cheaper}</div>
            <div className="small">유&nbsp;리</div>
          </div>
        </div>
      </div>

      <footer className="note">
        ※ 부가가치세는 소계 금액의 10%, 전력산업기반기금은 소계 금액의 3.7%를 각각 10원 미만 절사하여 산정한 값입니다(한전 청구 관행 기준 근사치이며, 실제 고지서와 원단위에서 소폭 차이가 날 수 있습니다).<br/>
        ※ 종합계약은 세대분(주택용저압 합산) + 공용분(일반용전력)을 각각 별도 계약으로 산정하는 방식이며, 단일계약은 세대+공용 전체 사용량을 주택용고압 요율 하나로 통합 산정하는 방식입니다.<br/>
        ※ 입력값은 한전 사이버지점(cyber.kepco.co.kr) 청구내역 조회 화면의 기본요금·전력량요금·기후환경요금·연료비조정액을 그대로 옮겨 입력하면 됩니다.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

  {from:"2024-01",to:"2099-12",bl:[910,1600,7300],bh:[730,1260,6060],t:[200,400],el:{o:[88.3,182.9,275.6],s:[120.0,214.6,307.3],w:[120.0,214.6,307.3]},eh:{o:[75.4,145.3,217.6],s:[101.4,171.3,243.6],w:[101.4,171.3,243.6]},cl:9.0,fu:5.0,note:"현행(2024)"},

const GB={high2:8230,high1:7220,low:6160};
const GR={high2:{s:130,w:130,o:98},high1:{s:130,w:130,o:98},low:{s:163,w:163,o:114}};
const TC=["#43a047","#f57c00","#e53935","#6a1b9a"];

function getRate(ym){const s=ym.replace("-","");return RH.find(r=>s>=r.from.replace("-","")&&s<=r.to.replace("-",""))||RH[RH.length-1];}
function getSeason(ym){const m=parseInt(ym.split("-")[1]);return m>=7&&m<=8?"s":m>=12||m<=2?"w":"o";}

function calcUnit(kwh,rate,hi,sk){
  if(kwh<=0)return{basic:0,energy:0,climate:0,fuel:0,sub:0,vat:0,fund:0,total:0,tier:0};
  const bas=hi?rate.bh:rate.bl,en=(hi?rate.eh:rate.el)[sk]||(hi?rate.eh:rate.el).o,t=rate.t;
  let tier=0;for(let i=t.length-1;i>=0;i--){if(kwh>t[i]){tier=i+1;break;}}
  const basic=bas[Math.min(tier,bas.length-1)];
  let energy=0,rem=kwh;
  for(let i=0;i<t.length;i++){const lo=i===0?0:t[i-1],used=Math.min(rem,t[i]-lo);energy+=Math.round(used*en[i]);rem-=used;if(rem<=0)break;}
  if(rem>0)energy+=Math.round(rem*en[en.length-1]);
  const climate=Math.round(kwh*(rate.cl||0)),fuel=Math.round(kwh*(rate.fu||0));
  const sub=basic+energy+climate+fuel,vat=Math.round(sub*0.10),fund=Math.round(sub*0.037);
  return{basic,energy,climate,fuel,sub,vat,fund,total:Math.round((sub+vat+fund)/10)*10,tier};
}

function calcCommon(cKwh,totalKwh,billingKw,gType,sk,rate){
  if(cKwh<=0)return{basic:0,energy:0,climate:0,fuel:0,elecFee:0,vat:0,fund:0,total:0,ratio:0,basicRate:0,ur:0};
  const basicRate=GB[gType]||GB.high2,ur=(GR[gType]||GR.high2)[sk];
  const ratio=totalKwh>0?cKwh/totalKwh:0;
  const basic=Math.round(billingKw*ratio*basicRate),energy=Math.round(cKwh*ur);
  const climate=Math.round(cKwh*(rate.cl||0)),fuel=Math.round(cKwh*(rate.fu||0));
  const elecFee=basic+energy+climate+fuel,vat=Math.round(elecFee*0.10),fund=Math.round(elecFee*0.032);
  return{basic,energy,climate,fuel,elecFee,vat,fund,total:Math.round((elecFee+vat+fund)/10)*10,ratio:Math.round(ratio*10000)/100,basicRate,ur};
}

function Panel({children,style={}}){return <div style={{background:"#0d2137",borderRadius:12,border:"1px solid #2a4a7f",padding:"16px 18px",marginBottom:14,...style}}>{children}</div>;}
function Tag({c,ch}){return <span style={{background:c+"22",border:"1px solid "+c+"66",borderRadius:5,padding:"2px 8px",fontSize:10,color:c,fontWeight:700}}>{ch}</span>;}

function NumInput({label,value,onChange,unit,color="#90caf9",min=0}){
  return(
    <div>
      <div style={{fontSize:10,color:"rgba(255,255,255,0.45)",marginBottom:4}}>{label}</div>
      <div style={{display:"flex",alignItems:"center",gap:6}}>
        <input type="number" value={value} min={min} onChange={e=>onChange(Number(e.target.value))}
          style={{flex:1,padding:"7px 10px",background:"#0a1e36",border:"2px solid "+color,borderRadius:8,color,fontSize:14,fontWeight:800,textAlign:"right",outline:"none"}}/>
        {unit&&<span style={{fontSize:10,color:"rgba(255,255,255,0.35)",whiteSpace:"nowrap"}}>{unit}</span>}
      </div>
    </div>
  );
}

  const avgKwh=unitCount>0?Math.round((unitKwh+commonKwh)/unitCount):0;
  const unitH=calcUnit(avgKwh,rate,true,sk);

          <div style={{flex:1}}>
            <div style={{fontSize:15,fontWeight:900,color:"#fff"}}>GBS G-123 전기요금 정밀분석기</div>
            <div style={{fontSize:10,color:"#43a047",fontWeight:700}}>한전 사이버지점 자료 직접 입력 -> 종합 vs 단일 완벽 비교 | 한전 오류 수정 완성판</div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            <div style={{background:gc+"22",border:"1px solid "+gc+"55",borderRadius:8,padding:"4px 10px",fontSize:11,fontWeight:700,color:gc}}>{gn}</div>
            <input type="month" value={ym} min="2002-06" max="2099-12" onChange={e=>setYm(e.target.value)}

              <div style={{fontSize:12,fontWeight:800,color:"#90caf9",marginBottom:3}}>종합계약 (저압)</div>
              <div style={{fontSize:9,color:"rgba(255,255,255,0.4)",marginBottom:12,lineHeight:1.7}}>세대: 주택용전력 저압<br/>공용: 일반용전력 별도 청구</div>
              <div style={{fontSize:10,color:"rgba(255,255,255,0.4)"}}>전기요금계</div>
              <div style={{fontSize:20,fontWeight:800,color:"#90caf9",marginBottom:4}}>{jongElecFee.toLocaleString()}원</div>
              <div style={{height:1,background:"rgba(255,255,255,0.08)",marginBottom:10}}/>
              <div style={{fontSize:10,color:"rgba(255,255,255,0.4)"}}>최종 청구요금</div>
              <div style={{fontSize:28,fontWeight:900,color:"#fff"}}>{jongTotal.toLocaleString()}<span style={{fontSize:12,color:"rgba(255,255,255,0.35)",marginLeft:3}}>원</span></div>
              <div style={{fontSize:9,color:"rgba(255,255,255,0.3)",marginTop:4}}>세대당 {Math.round(jongTotal/unitCount).toLocaleString()}원</div>
            </div>

            <div style={{textAlign:"center",display:"flex",flexDirection:"column",justifyContent:"center",minWidth:100,gap:8}}>
              <div style={{fontSize:9,color:"rgba(255,255,255,0.35)"}}>단지 전체 차액</div>
              <div style={{fontSize:32,fontWeight:900,color:diff>0?"#ef9a9a":diff<0?"#43a047":"#fff",lineHeight:1}}>{diff>0?"▲":diff<0?"▼":""}{Math.abs(diff).toLocaleString()}</div>
              <div style={{fontSize:12,color:"rgba(255,255,255,0.35)"}}>원/월</div>
              <div style={{height:1,background:"rgba(255,255,255,0.08)"}}/>
              <div style={{fontSize:9,color:"rgba(255,255,255,0.35)"}}>세대당 차액</div>
              <div style={{fontSize:20,fontWeight:800,color:"#ffd600"}}>{Math.abs(perUnit).toLocaleString()}원</div>
              <div style={{height:1,background:"rgba(255,255,255,0.08)"}}/>
              <div style={{fontSize:9,color:"rgba(255,255,255,0.35)"}}>연간 차액</div>
              <div style={{fontSize:16,fontWeight:800,color:"#ffd600"}}>{(Math.abs(diff)*12).toLocaleString()}원</div>
            </div>

            <div style={{background:"rgba(239,154,154,0.07)",border:"2px solid #ef9a9a44",borderRadius:12,padding:"16px",textAlign:"center"}}>
              <div style={{fontSize:12,fontWeight:800,color:"#ef9a9a",marginBottom:3}}>단일계약 (고압)</div>
              <div style={{fontSize:9,color:"rgba(255,255,255,0.4)",marginBottom:12,lineHeight:1.7}}>전체(세대+공용) 하나의 계량기<br/>주택용전력 고압 단일 산출</div>
              <div style={{fontSize:10,color:"rgba(255,255,255,0.4)"}}>전기요금계</div>
              <div style={{fontSize:20,fontWeight:800,color:"#ef9a9a",marginBottom:4}}>{danElecFee.toLocaleString()}원</div>
              <div style={{height:1,background:"rgba(255,255,255,0.08)",marginBottom:10}}/>
              <div style={{fontSize:10,color:"rgba(255,255,255,0.4)"}}>최종 청구요금</div>
              <div style={{fontSize:28,fontWeight:900,color:"#fff"}}>{danTotal.toLocaleString()}<span style={{fontSize:12,color:"rgba(255,255,255,0.35)",marginLeft:3}}>원</span></div>
              <div style={{fontSize:9,color:"rgba(255,255,255,0.3)",marginTop:4}}>세대당 {Math.round(danTotal/unitCount).toLocaleString()}원</div>
            </div>
          </div>

          <div style={{background:diff>0?"rgba(239,83,80,0.12)":"rgba(67,160,71,0.12)",border:"2px solid "+(diff>0?"#ef535055":"#43a04755"),borderRadius:12,padding:"14px 16px",textAlign:"center"}}>
            <div style={{fontSize:15,fontWeight:900,color:diff>0?"#ef9a9a":"#43a047",marginBottom:6}}>
              {diff>0?"종합계약이 단일계약보다 비쌉니다!":"종합계약이 단일계약보다 유리합니다!"}
            </div>
            <div style={{fontSize:12,color:"rgba(255,255,255,0.65)",lineHeight:2.0}}>
              세대당 월 <b style={{color:"#ffd600",fontSize:14}}>{Math.abs(perUnit).toLocaleString()}원</b> 차액 |
              단지 전체 월 <b style={{color:"#ffd600",fontSize:14}}>{Math.abs(diff).toLocaleString()}원</b> |
              연간 <b style={{color:"#ffd600",fontSize:14}}>{(Math.abs(diff)*12).toLocaleString()}원</b>
            </div>
          </div>
        </div>

        <button onClick={()=>setSD(v=>!v)} style={{width:"100%",padding:"11px",borderRadius:10,border:"1px solid #2a4a7f",background:"#0a1628",color:"#90caf9",fontWeight:700,fontSize:12,cursor:"pointer",marginBottom:10}}>
          항목별 상세 비교표 {showDetail?"닫기":"펼치기"}
        </button>

        {showDetail&&(
          <div style={{background:"#0d2137",borderRadius:12,border:"2px solid #ffd60033",padding:"16px",marginBottom:14}}>
            <div style={{fontSize:13,fontWeight:800,color:"#ffd600",marginBottom:12}}>단지 전체 전기요금 항목별 비교</div>
            <table>
              <thead>
                <tr style={{background:"#061428"}}>
                  {["항목","종합계약(저압)","단일계약(고압)","차액"].map(h=>(
                    <th key={h} style={{textAlign:h==="항목"?"left":"right",color:"rgba(255,255,255,0.4)",fontSize:10,borderBottom:"1px solid #1e3a5f"}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {[
                  ["기본요금",jongBasic,danBasic,false],
                  ["전력량요금",jongEnergy,danEnergy,false],
                  ["기후환경요금",jongClimate,danClimate,false],
                  ["연료비조정액",jongFuel,danFuel,false],
                  ["전기요금계",jongElecFee,danElecFee,true],
                  ["부가가치세(10%)",jongVat,danVat,false],
                  ["전력기반기금(3.7%)",jongFund,danFund,false],
                  ["최종 청구요금",jongTotal,danTotal,true],
                  ["세대당 환산",Math.round(jongTotal/unitCount),Math.round(danTotal/unitCount),true],
                ].map(([l,a,b,bold],i)=>{
                  const d=a-b;
                  return(
                    <tr key={i} style={{background:bold?"#1a2a4a":i%2?"#0a1628":"#0d1e36",borderTop:"1px solid #1e3a5f"}}>
                      <td style={{color:bold?"#fff":"rgba(255,255,255,0.6)",fontWeight:bold?700:400,fontSize:11}}>{l}</td>
                      <td style={{textAlign:"right",color:"#90caf9",fontWeight:bold?800:400,fontSize:bold?13:11}}>{a.toLocaleString()}원</td>
                      <td style={{textAlign:"right",color:"#ef9a9a",fontWeight:bold?800:400,fontSize:bold?13:11}}>{b.toLocaleString()}원</td>
                      <td style={{textAlign:"right",color:d>0?"#ef9a9a":d<0?"#43a047":"#888",fontWeight:bold?800:600,fontSize:bold?13:11}}>{d>0?"▲":d<0?"▼":""}{Math.abs(d).toLocaleString()}원</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}

        <button onClick={()=>setSV(v=>!v)} style={{width:"100%",padding:"11px",borderRadius:10,border:"1px solid #43a04744",background:"rgba(67,160,71,0.05)",color:"#43a047",fontWeight:700,fontSize:12,cursor:"pointer",marginBottom:14}}>
          G-123 공용전기 재계산 검증 {showVerify?"닫기":"펼치기"}
        </button>

        {showVerify&&(
          <div style={{background:"#0d2137",borderRadius:12,border:"2px solid #43a04744",padding:"16px",marginBottom:14}}>
            <div style={{fontSize:13,fontWeight:800,color:"#43a047",marginBottom:12}}>공용전기(일반용전력) G-123 재계산 검증</div>
            <div style={{fontSize:10,color:"rgba(255,255,255,0.4)",marginBottom:10}}>
              총사용량({totalKwh.toLocaleString()}kWh) 중 공용({commonKwh.toLocaleString()}kWh) | 배분비율: {(commonKwh/totalKwh*100).toFixed(2)}%
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10,marginBottom:10}}>
              {[
                ["기본요금",billingKw+"kW x "+(commonKwh/totalKwh*100).toFixed(2)+"% x "+(GB[gType]||GB.high2).toLocaleString()+"원/kW",commonC.basic],
                ["사용량요금",commonKwh.toLocaleString()+"kWh x "+commonC.ur+"원/kWh",commonC.energy],
                ["기후환경요금",commonKwh.toLocaleString()+"kWh x "+(rate.cl||0)+"원",commonC.climate],
                ["연료비조정액",commonKwh.toLocaleString()+"kWh x "+(rate.fu||0)+"원",commonC.fuel],
              ].map(([l,f,v])=>(
                <div key={l} style={{background:"#061428",borderRadius:8,padding:"10px 12px",border:"1px solid #43a04733"}}>
                  <div style={{fontSize:10,color:"rgba(255,255,255,0.4)",marginBottom:2}}>{l}</div>
                  <div style={{fontSize:10,color:"rgba(255,255,255,0.4)",marginBottom:4}}>{f}</div>
                  <div style={{fontSize:14,fontWeight:800,color:"#43a047"}}>{v.toLocaleString()}원</div>
                </div>
              ))}
            </div>
            <div style={{background:"#ffcc80",borderRadius:8,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <span style={{fontSize:12,fontWeight:700,color:"#3d2a00"}}>공용전기 G-123 재계산 청구요금</span>
              <span style={{fontSize:22,fontWeight:900,color:"#3d2a00"}}>{commonC.total.toLocaleString()}원</span>
            </div>
            <div style={{background:"rgba(239,154,154,0.08)",border:"1px solid #ef9a9a33",borderRadius:8,padding:"12px"}}>
              <div style={{fontSize:11,fontWeight:700,color:"#ef9a9a",marginBottom:6}}>단일계약 세대당 평균 고압 계산 검증</div>
              <div style={{fontSize:10,color:"rgba(255,255,255,0.5)",marginBottom:4}}>
                단일세대평균 = (세대{unitKwh.toLocaleString()} + 공용{commonKwh.toLocaleString()}) / {unitCount}세대 = {avgKwh.toLocaleString()}kWh/세대
              </div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span style={{fontSize:11,color:"rgba(255,255,255,0.5)"}}>고압 {avgKwh.toLocaleString()}kWh x {unitCount}세대 = </span>
                <span style={{fontSize:16,fontWeight:800,color:"#ef9a9a"}}>{(unitH.total*unitCount).toLocaleString()}원</span>
              </div>
              <div style={{fontSize:9,color:"rgba(255,255,255,0.3)",marginTop:4}}>
                한전 제시 단일계약 전기요금계({danElecFee.toLocaleString()}원)와 차이 = {Math.abs(unitH.total*unitCount-danElecFee).toLocaleString()}원
              </div>
            </div>
          </div>
        )}

        <div style={{textAlign:"center",padding:"14px",fontSize:10,color:"rgba(255,255,255,0.2)",borderTop:"1px solid #1e3a5f"}}>
          GBS G-123 | 한전 사이버지점 자료 직접 입력 방식 | CO2 {CO2}kg/kWh | ojs.co.kr<br/>
          "1kWh의 가치를 국민과 함께" - GBS종합에너지관리 국민BIZ
        </div>
      </div>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("gbs-root"));
root.render(React.createElement(App,null));
</script>
</body>
</html>
